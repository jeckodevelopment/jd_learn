<title id="t">Illustrazione del profilo docente JD Learn</title><desc id="d">Schermata schematica del profilo pubblico con presentazione, corsi accessibili e un collegamento di modifica mostrato solo se autorizzato. Nomi ed esempi sono fittizi.</desc>
