<text x="270" y="320" fill="#22343c" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Presentazione</text><text x="270" y="351" fill="#52656b" font-family="Arial,sans-serif" font-size="17">Insegno botanica e biodiversità con attività pratiche,</text><text x="270" y="379" fill="#52656b" font-family="Arial,sans-serif" font-size="17">esempi e materiali di approfondimento.</text>
