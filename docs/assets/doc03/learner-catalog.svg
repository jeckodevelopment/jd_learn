<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Illustrazione del catalogo corsi JD Learn</title><desc id="d">Schermata schematica con ricerca, filtro categoria e tre schede di corso. Esempio illustrativo, non una cattura da un sito installato.</desc>
<rect width="1200" height="700" fill="#f2f5f5"/><rect width="1200" height="72" fill="#23636c"/>
<text x="50" y="46" fill="white" font-family="Arial,sans-serif" font-size="26" font-weight="bold">JD Learn</text><text x="1150" y="46" fill="white" text-anchor="end" font-family="Arial,sans-serif" font-size="17">Menu</text>
<rect x="48" y="100" width="1104" height="550" rx="16" fill="white" stroke="#c4d0d2" stroke-width="2"/>
<text x="88" y="155" fill="#22343c" font-family="Arial,sans-serif" font-size="34" font-weight="bold">Catalogo corsi</text><text x="88" y="188" fill="#52656b" font-family="Arial,sans-serif" font-size="18">Esplora i corsi disponibili e apri una scheda per i dettagli.</text>
<rect x="88" y="215" width="640" height="52" rx="7" fill="white" stroke="#52656b" stroke-width="2"/><text x="108" y="248" fill="#52656b" font-family="Arial,sans-serif" font-size="18">Cerca per titolo o descrizione</text>
<rect x="748" y="215" width="300" height="52" rx="7" fill="white" stroke="#52656b" stroke-width="2"/><text x="770" y="248" fill="#22343c" font-family="Arial,sans-serif" font-size="18">Categoria: tutte</text>
<g font-family="Arial,sans-serif"><rect x="88" y="300" width="310" height="235" rx="11" fill="#f7f9f9" stroke="#8b9a9d" stroke-width="2"/><text x="112" y="344" fill="#22343c" font-size="23" font-weight="bold">Introduzione</text><text x="112" y="374" fill="#22343c" font-size="23" font-weight="bold">alla botanica</text><text x="112" y="425" fill="#52656b" font-size="17">Percorso base · 5 lezioni</text><rect x="112" y="460" width="165" height="44" rx="7" fill="#23636c"/><text x="194" y="489" fill="white" text-anchor="middle" font-size="17" font-weight="bold">Apri il corso</text>
<rect x="428" y="300" width="310" height="235" rx="11" fill="#f7f9f9" stroke="#8b9a9d" stroke-width="2"/><text x="452" y="344" fill="#22343c" font-size="23" font-weight="bold">Storia dell’arte</text><text x="452" y="374" fill="#22343c" font-size="23" font-weight="bold">moderna</text><text x="452" y="425" fill="#52656b" font-size="17">Intermedio · 8 lezioni</text><rect x="452" y="460" width="165" height="44" rx="7" fill="#23636c"/><text x="534" y="489" fill="white" text-anchor="middle" font-size="17" font-weight="bold">Apri il corso</text>
<rect x="768" y="300" width="310" height="235" rx="11" fill="#f7f9f9" stroke="#8b9a9d" stroke-width="2"/><text x="792" y="344" fill="#22343c" font-size="23" font-weight="bold">Scrittura chiara</text><text x="792" y="374" fill="#22343c" font-size="23" font-weight="bold">per il web</text><text x="792" y="425" fill="#52656b" font-size="17">Laboratorio · 4 lezioni</text><rect x="792" y="460" width="165" height="44" rx="7" fill="#23636c"/><text x="874" y="489" fill="white" text-anchor="middle" font-size="17" font-weight="bold">Apri il corso</text></g>
<text x="88" y="590" fill="#52656b" font-family="Arial,sans-serif" font-size="17">I filtri si possono combinare con la ricerca.</text><text x="88" y="620" fill="#52656b" font-family="Arial,sans-serif" font-size="16">Esempio illustrativo: dati e corsi sono fittizi.</text></svg>