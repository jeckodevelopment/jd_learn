name: SECDEV-02 one-shot indent normalization
on:
  push:
    branches: [style/secdev02-psr12-mass-structures]
permissions:
  contents: write
concurrency:
  group: secdev02-indent-phpcbf
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'jeckodevelopment/jd_learn' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Pin PHP_CodeSniffer
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Apply only PHPCBF indentation fixes
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' | xargs -0 -r .runtime/secdev02-phpcs/vendor/bin/phpcbf \
            --standard=PSR12 --sniffs=Generic.WhiteSpace.ScopeIndent --no-cache --report=summary || code=$?
          test "${code:-0}" -le 2
          python3 - <<'PY'
          import pathlib
          import subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only", "-z", "--", "*.php"]).split(b"\0")
          for item in paths:
              if not item:
                  continue
              path = pathlib.Path(item.decode("utf-8"))
              raw = path.read_bytes()
              clean = b"\n".join(line.rstrip(b" \t") for line in raw.split(b"\n"))
              if clean != raw:
                  path.write_bytes(clean)
          PY
          git diff --check
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l >/tmp/secdev02-indent-php-lint.log
          echo "Changed PHP files: $(git diff --name-only -- '*.php' | wc -l)"
          echo "Lint and diff checks passed"
      - name: Commit and publish indentation-only pass
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "style/secdev02-psr12-mass-structures"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.php'
          git diff --cached --quiet && exit 0
          git commit -m "style(SECDEV-02): normalize indentation after structural PHPCBF [skip ci]"
          git push origin "HEAD:refs/heads/style/secdev02-psr12-mass-structures"
