name: SECDEV-02 corrected explicit PHP imports
on:
  push:
    branches:
      - style/secdev02-consolidated-1149-remediation
    paths:
      - .github/workflows/secdev02-1149-imports-retry.yml
permissions:
  contents: write
jobs:
  import-refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-consolidated-1149-remediation
          persist-credentials: true
      - name: Install pinned PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Run PHP lexer FQCN import bulk transformation
        run: |
          python3 tools/secdev02_explicit_import_bulk.py --self-test
          python3 tools/secdev02_explicit_import_bulk.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          git diff --check
      - name: Validate full source gates
        run: |
          python3 tools/build.py
          python3 tools/secdev02_source_contract_repair.py --base-ref HEAD
          git diff --check
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit guarded results and remove workflow
        run: |
          rm .github/workflows/secdev02-1149-imports-retry.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-1149-imports-retry.yml
          if git diff --cached --quiet; then
            echo 'No verified fixes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(SECDEV-02): PHP class import aliases for long statements'
          git push origin HEAD:style/secdev02-consolidated-1149-remediation
