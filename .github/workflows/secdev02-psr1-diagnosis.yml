name: SECDEV-02 PSR1 lint diagnosis (temporary)
on:
  push:
    branches: [style/secdev02-final-258-bulk-remediation]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Examine rejected code/symbol separation candidates
        shell: bash
        run: |
          git show b77c1908df19a4a8e93970d0581cdc02ba81c243:tools/secdev02_final_psr1_split.py > tools/secdev02_final_psr1_split.py
          python3 - <<'PY'
          import sys, subprocess
          from pathlib import Path
          sys.path.insert(0,'tools')
          from secdev02_final_psr1_split import make_declarations
          from secdev02_psr1_helper_extraction import inspect, rewrite
          for filename in ['joomla-dashboard.php','joomla-categories.php','joomla-cloudflare.php','joomla-associations.php','joomla-quiz-deadline.php','run.php']:
            path=Path('tests')/filename
            initial=path.read_bytes()
            helpers={}
            try:
              entry,defs=make_declarations(initial,path.stem)
              path.write_bytes(entry)
              manifest=inspect(path)
              pair=rewrite(entry,manifest,path.stem+'.functions.php')
              if pair:
                entry,fun=pair
                helpers[path.stem+'.functions.php']=fun
              helpers.update(defs)
              path.write_bytes(entry)
              print('ENTRY',filename,'functions=',len(manifest['functions']),'DEFINES=',len(defs),flush=True)
              lint=subprocess.run(['php','-l',str(path)],capture_output=True,text=True)
              print('ENTRY_LINT',lint.returncode,lint.stdout,lint.stderr,flush=True)
              for name,content in helpers.items():
                out=Path('tests/helpers')/name
                out.parent.mkdir(exist_ok=True)
                out.write_bytes(content)
                lint=subprocess.run(['php','-l',str(out)],capture_output=True,text=True)
                print('HELPER_LINT',name,lint.returncode,lint.stdout,lint.stderr,flush=True)
                out.unlink(missing_ok=True)
            except Exception as exc:
              print('EXCEPTION',filename,type(exc).__name__,str(exc),flush=True)
            finally:
              path.write_bytes(initial)
          PY
