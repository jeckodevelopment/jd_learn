name: SECDEV-02 one-shot mixed-expression structural remediation
on:
  push:
    branches:
      - style/secdev02-structural-line-closeout
    paths:
      - .github/workflows/secdev02-expression-one-shot.yml
permissions:
  contents: write
jobs:
  expressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-structural-line-closeout
          persist-credentials: true
      - name: Install pinned PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Format source-wide PHP conditional and comma expressions
        run: |
          python3 tools/secdev02_adaptive_operator_batch.py --self-test
          python3 tools/secdev02_adaptive_operator_batch.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          git diff --check
      - name: Audit full repository source policy and syntax
        run: |
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit validated fixes and remove workflow
        run: |
          rm .github/workflows/secdev02-expression-one-shot.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-expression-one-shot.yml
          if git diff --cached --quiet; then
            echo 'No candidate passed all gates'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): safe multiline ternary and comma expressions'
          git push origin HEAD:style/secdev02-structural-line-closeout
