name: SECDEV-02 consolidated structural remainder pass
on:
  push:
    branches:
      - style/secdev02-192-final-consolidated
    paths:
      - .github/workflows/secdev02-final-structural.yml
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Pinned PHPCS and PHPCBF
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Second protected sweep for structural PHP and HTML
        shell: bash
        run: |
          set -euo pipefail
          PHP_CS="$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcs"
          PHP_CBF="$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcbf"
          python3 tools/secdev02_structural_template_bulk.py --phpcs "$PHP_CS"
          python3 tools/secdev02_query_chain_wrap.py --phpcs "$PHP_CS" --apply
          python3 tools/secdev02_explicit_import_bulk.py --phpcs "$PHP_CS"
          python3 tools/secdev02_mass_array_semantic.py --phpcs "$PHP_CS" --phpcbf "$PHP_CBF" --max-files 180 --passes 3
          python3 tools/secdev02_granular_expression_batch.py --phpcs "$PHP_CS" --top-files 220 --max-examined 20 --max-fixes 15
          git diff --check
          git diff --name-only -- '*.php' | while IFS= read -r file; do
            php -l "$file" >/dev/null
          done
      - name: Measure and publish second pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from collections import Counter
          files=[f for f in subprocess.check_output(['git','ls-files','-z','--','*.php']).decode().split('\0') if f]
          result=subprocess.run(['.runtime/secdev02-phpcs/vendor/bin/phpcs','--standard=PSR12','--report=json',*files],capture_output=True,text=True)
          obj=json.loads(result.stdout)
          by=Counter(m['source'] for f in obj['files'].values() for m in f['messages'])
          total=sum(by.values())
          print(f'SECDEV-02 second pass total={total}',flush=True)
          for name,n in by.most_common(): print(name,n)
          with open('docs/SECDEV_02_FINAL_192_BATCH.md','a') as fp:
              fp.write(f'\n## Second protected sweep\n\nFull PSR12 4.0.4 count after second sweep: **{total}**. No change of SECDEV-02 status or manual-acceptance claims.\n')
              fp.write('\n'.join(f'- `{k}`: {v}' for k,v in by.most_common())+'\n')
          PY
          git rm .github/workflows/secdev02-final-structural.yml
          git add component libraries plugins tests docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): second protected structural and template sweep'
          git push origin HEAD:style/secdev02-192-final-consolidated
