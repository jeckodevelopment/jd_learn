name: SECDEV-02 structural header remediation one-shot
on:
  push:
    branches: [style/secdev02-structural-128-remediation]
    paths: [.github/workflows/secdev02-structural-diagnostics.yml]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install pinned PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Repair misplaced test file docblocks only when PHPCS improves
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import subprocess,re,json
          root=Path('.')
          phpcs='.runtime/secdev02-phpcs/vendor/bin/phpcs'
          accepted=[]
          pattern=re.compile(r'\A(<\?php\r?\n\r?\n)(declare\(strict_types=1\);\r?\n\r?\n)(/\*\*[^\r\n]*\*/\r?\n)')
          def audit(path):
              run=subprocess.run([phpcs,'--standard=PSR12','--report=json','--no-cache',str(path)],capture_output=True,text=True)
              d=json.loads(run.stdout)
              return Counter(m['source'] for f in d['files'].values() for m in f['messages'])
          for path in sorted(root.glob('tests/*.php')):
              initial=path.read_text()
              match=pattern.match(initial)
              if not match:
                  continue
              updated=(match.group(1)+match.group(2)+match.group(3).replace('/**','/*',1)+initial[match.end():])
              old=audit(path)
              path.write_text(updated)
              lint=subprocess.run(['php','-l',str(path)],capture_output=True)
              new=audit(path) if lint.returncode == 0 else Counter({'lint.failed':1})
              if lint.returncode or new-old or sum(new.values()) >= sum(old.values()):
                  path.write_text(initial)
                  continue
              accepted.append((str(path),sum(old.values())-sum(new.values())))
          print('SECDEV-02 accepted header files:',len(accepted), 'findings removed:',sum(x[1] for x in accepted))
          print('Files:',accepted)
          PY
      - name: Validate and commit source-only fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- 'tests/*.php'
          if git diff --cached --quiet; then echo "No accepted fixes"; exit 0; fi
          git commit -m "style(SECDEV-02): correct misplaced test file docblocks without PHP regressions"
          git push
