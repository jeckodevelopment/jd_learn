name: SECDEV-02 reconcile latest main once
on:
  push:
    branches: [style/secdev02-linewrap-comma-recovery]
    paths: [.github/workflows/secdev02-merge-main-once.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Merge latest main retaining both SECDEV-02 evidence updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then
            echo "Fast conflict-free merge"
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              case "$file" in
                docs/REQUIREMENTS_STATUS.csv|docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md)
                  git checkout --theirs "$file"
                  ;;
                *)
                  echo "Unexpected merge conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path("docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md")
          ours=subprocess.check_output(["git","show","HEAD:"+str(p)], text=True)
          section=ours.split("## Ulteriore batch di delimitatori PHP (dopo PR #991)",1)[1]
          p.write_text(p.read_text()+"\n## Ulteriore batch di delimitatori PHP (dopo PR #991)"+section)
          csv=Path("docs/REQUIREMENTS_STATUS.csv")
          s=csv.read_text()
          anchor="PR #991: batch operatori PHP:"
          replacement=("PR #993: batch delimitatori PHP: 51 rilievi PSR-12 ridotti in 30 file "
                       "con token identici, lint e PHPCS senza regressioni; non completa SECDEV-02. "+anchor)
          if anchor not in s:
              raise RuntimeError("No canonical SECDEV-02 row anchor")
          s=s.replace(anchor,replacement,1)
          if "93;981;984;985;986;987;988;989;990;991;992," in s:
              s=s.replace("93;981;984;985;986;987;988;989;990;991;992,",
                          "93;981;984;985;986;987;988;989;990;991;992;993,",1)
          else:
              raise RuntimeError("No PR ledger anchor")
          csv.write_text(s)
          PY
          fi
          git add -A
          git diff --cached --check
          git commit -m "merge(SECDEV-02): reconcile merged Joomla API gate with PSR-12 batch"
          git push
