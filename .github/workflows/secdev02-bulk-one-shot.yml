name: SECDEV-02 one-PR mass structural clean-up
on:
  push:
    branches:
      - style/secdev02-one-pr-bulk-refactor
    paths:
      - .github/workflows/secdev02-bulk-one-shot.yml
permissions:
  contents: write
jobs:
  safe-bulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-one-pr-bulk-refactor
          persist-credentials: true
      - name: Install real pinned PHP_CodeSniffer
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Run project-wide lexer-aware whitespace structural remediation
        run: |
          python3 tools/secdev02_whitespace_bulk_refactor.py --self-test
          python3 tools/secdev02_whitespace_bulk_refactor.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          git diff --check
      - name: Validate syntax, whole-source PSR12 non-regression and project contracts
        run: |
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit accepted changes to isolated branch and remove privileged workflow
        run: |
          rm .github/workflows/secdev02-bulk-one-shot.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-bulk-one-shot.yml
          if git diff --cached --quiet; then
            echo 'No fixes passed all gates'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): mass source-aware PHP whitespace remediation'
          git push origin HEAD:style/secdev02-one-pr-bulk-refactor
