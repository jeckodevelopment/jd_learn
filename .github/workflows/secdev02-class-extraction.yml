name: SECDEV02 mass structural class fixture extraction
on:
  push:
    branches: [style/secdev02-867-mass-refactor]
permissions:
  contents: write
jobs:
  restructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned PHPCS and Python style
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          python3 -m pip install --user ruff==0.14.6
      - name: Extract global classes from executable PHP fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff check --select E701,E702 tools/secdev02_mass_class_extraction.py
          python3 tools/secdev02_mass_class_extraction.py --self-test
          python3 tools/secdev02_mass_class_extraction.py --phpcs "$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcs" --phpcbf "$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcbf"
      - name: Reconcile source contracts and new helper files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py
          python3 tools/secdev02_source_contract_repair.py --base-ref HEAD --max-reversions 80
          python3 - <<'PY'
          import pathlib,subprocess
          root=pathlib.Path('.')
          changed=set(subprocess.check_output(['git','diff','--name-only','--','tests/*.php'],text=True).splitlines())
          for helper in (root/'tests/helpers').glob('*.*.php'):
              base=helper.name.split('.',1)[0]+'.php'
              if 'tests/'+base not in changed:
                  helper.unlink()
                  print(f'REMOVED orphan helper {helper}',flush=True)
          PY
          python3 tools/check.py
      - name: Full PSR12 scan and requirements evidence
        shell: bash
        run: |
          set -euo pipefail
          git add tests
          python3 - <<'PY'
          import csv,importlib.machinery,pathlib,subprocess,tempfile
          root=pathlib.Path('.').resolve()
          phpcs=root/'.runtime/secdev02-phpcs/vendor/bin/phpcs'
          audit=importlib.machinery.SourceFileLoader('audit',str(root/'tests/secdev02-psr12-phpcs.py')).load_module()
          now=audit.signatures(phpcs,root,audit.tracked_php(root))
          with tempfile.TemporaryDirectory() as td:
              temp=pathlib.Path(td)
              before=audit.signatures(phpcs,temp,audit.baseline(root,'HEAD',temp))
          introduced=audit.diff(now,before)
          first,last=sum(before.values()),sum(now.values())
          files=subprocess.check_output(['git','diff','HEAD','--name-only','--','*.php'],text=True).splitlines()
          print(f'PSR1 CLASS MASS RESULT {first}->{last} (-{first-last}) PHP files={len(files)}',flush=True)
          assert not introduced,f'New PHPCS source/rule violations: {introduced}'
          assert last<first and len(files)>0,'No measured reduction'
          for path in files:
              subprocess.run(['php','-l',path],check=True,stdout=subprocess.DEVNULL)
          doc=root/'docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md'
          with doc.open('a',encoding='utf-8') as f:
              f.write(f"\n### SECDEV-02/PR #1018 structural PSR1 class fixture batch\n\nPinned PHPCS 4.0.4 PSR12 exhaustive inventory: **{first} → {last}**, **-{first-last} findings**, across **{len(files)} PHP files** including new class-only helper files. Executable CLI test scripts retain their runtime declaration ordering; each isolated class preserves its own code and original strict-types mode, and all new helpers have zero PSR12 violations. No new warnings or exclusions. CI must validate Joomla test functionality. **SECDEV-02 and manual acceptance remain partial; functional coverage percentages unchanged.**\n\n### Comportamenti da testare\n\n- Class load order, mock Joomla services, fixtures and exit statuses in isolated CLI and integrated CI.\n- PHP lint, token compatibility, PHPCS 4.0.4 per file/rule, source contracts and package installation.\n")
          target=root/'docs/REQUIREMENTS_STATUS.csv'
          with target.open(newline='',encoding='utf-8') as f:
              rows=list(csv.reader(f))
          header=rows[0]
          entry=[r for r in rows if r and r[0]=='SECDEV-02']
          assert len(entry)==1
          entry[0][header.index('Evidenza e limiti')]+=f' PR #1018 structural test class extraction: PHPCS PSR12 {first}->{last} (-{first-last}), no new file/rule findings, coverage unchanged.'
          with target.open('w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
          python3 tests/requirements-status.py
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          git diff --check
      - name: Remove temporary workflow and publish one consolidated commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secdev02-class-extraction.yml
          git add tests tools docs
          git diff --cached --check
          git commit -m 'style(SECDEV-02): safe mass extraction of isolated PSR1 test fixtures'
          git push origin HEAD:style/secdev02-867-mass-refactor
