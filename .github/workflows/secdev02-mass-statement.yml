name: SECDEV-02 massive statement reflow one-shot
on:
  push:
    branches: [style/secdev02-867-mass-refactor]
permissions:
  contents: write
jobs:
  bulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned PHPCS 4.0.4 and Python style verifier
        run: |
          mkdir -p .runtime/psr12
          composer require --working-dir=.runtime/psr12 --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          python3 -m pip install --user ruff==0.14.6
      - name: Massive expression-level PHP reflow
        run: |
          set -euo pipefail
          python3 -m ruff check --select E701,E702 tools/secdev02_mass_statement_reflow.py
          python3 tools/secdev02_mass_statement_reflow.py --self-test
          python3 tools/secdev02_mass_statement_reflow.py --phpcs "$PWD/.runtime/psr12/vendor/bin/phpcs" --max-files=380
      - name: Reconcile source contracts without waivers
        run: |
          set -euo pipefail
          python3 tools/build.py
          python3 tools/secdev02_source_contract_repair.py --base-ref HEAD --max-reversions 75
          python3 tools/check.py
      - name: Certify full PSR12 net reduction and write evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,importlib.machinery,pathlib,subprocess,tempfile
          root=pathlib.Path('.').resolve()
          phpcs=root/'.runtime/psr12/vendor/bin/phpcs'
          audit=importlib.machinery.SourceFileLoader('audit',str(root/'tests/secdev02-psr12-phpcs.py')).load_module()
          after=audit.signatures(phpcs,root,audit.tracked_php(root))
          with tempfile.TemporaryDirectory() as td:
              base=pathlib.Path(td)
              before=audit.signatures(phpcs,base,audit.baseline(root,'HEAD',base))
          issues=audit.diff(after,before)
          count_before,count_after=sum(before.values()),sum(after.values())
          changed=subprocess.check_output(['git','diff','--name-only','--','*.php'],text=True).splitlines()
          print(f'SECDEV-02 massive refactor PHPCS: {count_before}->{count_after} (-{count_before-count_after}), modified PHP sources={len(changed)}',flush=True)
          assert not issues,f'New per-file/per-rule findings: {issues}'
          assert count_after<count_before and len(changed)>0,'No verified improvement'
          for file in changed:
              subprocess.run(['php','-l',file],check=True,stdout=subprocess.DEVNULL)
          doc=root/'docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md'
          with doc.open('a',encoding='utf-8') as f:
              f.write(f"\n## SECDEV-02 mass statement reflow, PR #1018 (24 November 2026)\n\nMeasured using pinned PHPCS 4.0.4 PSR12 on every tracked PHP file: **{count_before} → {count_after}** (net **-{count_before-count_after}** violations) across **{len(changed)} PHP files**. Entire long PHP statements reflowed at lexer-recognized operators and separators while significant PHP tokens, strings, source contracts, lint and PHPCS per-file/per-rule nonregression were enforced. Any incompatible candidate was rolled back. No PHPCS rule relaxed. Full CI and Joomla integration remain required. **SECDEV-02 is not closed while findings and separate CORE/API criteria remain. The functional coverage percentage is unchanged; manual Joomla acceptance remains pending.**\n\n### Comportamenti da testare\n\n- Joomla backend/frontend including curriculum, course publication, classroom, email, certificates, ACL and media.\n- PHP lint, source contract tests, SAST, PHPCS PSR-12 full scan, package build, Chromium, PHP 8.3/MySQL 8.4 and PHP 8.4/MariaDB 10.6.\n")
          matrix=root/'docs/REQUIREMENTS_STATUS.csv'
          with matrix.open(newline='',encoding='utf-8') as f:
              rows=list(csv.reader(f))
          hdr=rows[0]
          entry=[r for r in rows if r and r[0]=='SECDEV-02']
          assert len(entry)==1
          row=entry[0]
          row[hdr.index('Evidenza e limiti')]+=f' PR #1018 large statement batch: PHPCS PSR12 {count_before}->{count_after} (-{count_before-count_after}) across {len(changed)} source files, no file/rule regressions; coverage unchanged, SECDEV-02 partial.'
          col=hdr.index('PR implementazione')
          if '1018' not in row[col].split(';'):
              row[col]+=';1018'
          with matrix.open('w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
          python3 tests/requirements-status.py
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          git diff --check
      - name: Remove one-shot workflows and commit verified changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secdev02-mass-diagnostics.yml
          git rm .github/workflows/secdev02-mass-statement.yml
          git add component libraries plugins tests tools docs
          git diff --cached --check
          git commit -m 'style(SECDEV-02): massive verified PHP statement PSR-12 remediation'
          git push origin HEAD:style/secdev02-867-mass-refactor
