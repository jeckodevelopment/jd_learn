name: SECDEV-02 mass literal wrapping once
on:
  push:
    branches: [style/secdev02-massive-literal-lines]
    paths: [.github/workflows/secdev02-mass-literal-once.yml]
permissions:
  contents: write
jobs:
  literals:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install pinned official PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Explore semantics-preserving string wrapping
        run: python3 tools/secdev02-literals-once.py
      - name: Validate, commit and push accepted changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -d '' paths < <(git diff --name-only -z --diff-filter=ACM -- '*.php')
          for path in "${paths[@]}"; do php -l "$path" >/dev/null; done
          echo "LITERAL LINT CHECK ${#paths[@]} source files"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.php'
          if git diff --cached --quiet; then echo "No accepted source changes"; exit 0; fi
          git commit -m "style(SECDEV-02): mass literal line wrapping with unchanged string bytes"
          git push
