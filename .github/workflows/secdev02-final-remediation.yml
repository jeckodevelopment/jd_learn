name: SECDEV-02 one-shot final PSR-12 remediation
on:
  push:
    branches:
      - style/secdev02-psr12-final-remediation
    paths:
      - .github/workflows/secdev02-final-remediation.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install pinned PHPCBF
        run: |
          mkdir -p .runtime/secdev02-fix
          composer require --working-dir=.runtime/secdev02-fix --no-interaction --no-progress squizlabs/php_codesniffer:4.0.4
      - name: Apply PSR-12 auto-fixes across tracked PHP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(git ls-files -z -- '*.php')
          test "${#php_files[@]}" -gt 0
          set +e
          .runtime/secdev02-fix/vendor/bin/phpcbf --standard=PSR12 --no-cache --encoding=utf-8 "${php_files[@]}"
          code=$?
          set -e
          if [ "$code" -gt 2 ]; then exit "$code"; fi
          echo "PHPCBF exit: $code"
      - name: Verify changed PHP syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACM -- '*.php')
          for file in "${changed[@]}"; do php -l "$file" >/dev/null; done
          echo "Lint verified on ${#changed[@]} modified PHP files"
      - name: Commit isolated mechanical remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.php'
          if git diff --cached --quiet; then echo "No auto-fixable findings"; exit 0; fi
          git commit -m "style(SECDEV-02): apply remaining safe PHPCBF PSR-12 fixes"
          git push
