name: SECDEV-02 one-shot PSR1 source diagnostic
on:
  push:
    branches:
      - test/secdev02-joomla-native-runtime-contracts
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Inspect only newly introduced PSR1 finding
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          .runtime/secdev02-phpcs/vendor/bin/phpcs --standard=PSR12 --report=json tests/secdev02-joomla-native-runtime.php tests/fixtures/secdev02-native-api-functions.php > /tmp/findings.json || :
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/findings.json'))
          for path, meta in d['files'].items():
              for m in meta['messages']:
                  print('SECDEV02_DIAG',path,m['line'],m['source'],m['message'])
          PY
      - name: Remove privileged one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secdev02-psr1-diag-once.yml
          git commit -m 'chore(SECDEV-02): remove one-shot diagnostic workflow'
          git push origin HEAD:test/secdev02-joomla-native-runtime-contracts
