name: Publish installable JD Learn development ZIP
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-package.yml
      - tools/build.py
      - tools/verify_installable.py
      - component/**
      - libraries/**
      - plugins/**
      - packages/**
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jdlearn-dev-package-direct
  cancel-in-progress: false
jobs:
  publish-development-package:
    # Never promote a pull-request candidate, fork, or a non-main ref.
    if: github.repository == 'jeckodevelopment/jd_learn' && github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main (build does not need write credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and validate the actual Joomla ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("packages/pkg_jlms.xml").findtext("version"))')-dev"
          name="pkg_jlms-${version}.zip"
          python3 tools/verify_installable.py "dist/$name"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/$name" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Publish a distinct development prerelease (never the stable release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: jdlearn-dev-latest
          ZIP_FILE: ${{ steps.package.outputs.name }}
          DEV_VERSION: ${{ steps.package.outputs.version }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          {
            echo "JD Learn development snapshot. Not the stable 1.0.0 release."
            echo
            echo "Install ONLY $ZIP_FILE directly in Joomla (without extraction)."
            echo "SHA-256: $ZIP_SHA256"
            echo "Source commit: $GITHUB_SHA"
            echo "This moving development tag is NOT the public Joomla update server."
          } > /tmp/jdlearn-dev-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Move the development-only lightweight tag to the exact source build.
            # This never changes any stable version tag or production update feed.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload "$RELEASE_TAG" "dist/$ZIP_FILE" dist/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --prerelease \
              --title "JD Learn development snapshot ($DEV_VERSION)" \
              --notes-file /tmp/jdlearn-dev-notes.md
          else
            gh release create "$RELEASE_TAG" "dist/$ZIP_FILE" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "JD Learn development snapshot ($DEV_VERSION)" \
              --notes-file /tmp/jdlearn-dev-notes.md
          fi
      - name: Confirm public direct ZIP bytes are the installable Joomla archive
        shell: bash
        env:
          ZIP_FILE: ${{ steps.package.outputs.name }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          public="https://github.com/$GITHUB_REPOSITORY/releases/download/jdlearn-dev-latest/$ZIP_FILE"
          curl --fail --location --retry 5 --retry-delay 2 --output /tmp/jdlearn-public.zip "$public"
          echo "$ZIP_SHA256  /tmp/jdlearn-public.zip" | sha256sum --check --status
          python3 tools/verify_installable.py /tmp/jdlearn-public.zip
          echo "Verified direct-download Joomla ZIP: $public"
