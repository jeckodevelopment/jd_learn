name: SECDEV-02 mixed PHP markup remediation one-shot
on:
  push:
    branches:
      - style/secdev02-psr12-targeted-bulk-1011
    paths:
      - .github/workflows/secdev02-mixed-html-one-shot.yml
permissions:
  contents: write
jobs:
  mass-template-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-psr12-targeted-bulk-1011
          persist-credentials: true
      - name: Install pinned code sniffer
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Normalize all eligible HTML attribute lengths in PHP templates
        run: |
          python3 tools/secdev02_template_tag_reflow.py --self-test
          python3 tools/secdev02_template_tag_reflow.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          git diff --check
      - name: Full PHP and structural checks
        run: |
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit only safe modifications and delete workflow
        run: |
          rm .github/workflows/secdev02-mixed-html-one-shot.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-mixed-html-one-shot.yml
          if git diff --cached --quiet; then
            echo 'No eligible changes passed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): mixed PHP HTML longline batch'
          git push origin HEAD:style/secdev02-psr12-targeted-bulk-1011
