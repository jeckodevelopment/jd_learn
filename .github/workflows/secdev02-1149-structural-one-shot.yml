name: SECDEV-02 one-shot structural source and test batch
on:
  push:
    branches:
      - style/secdev02-consolidated-1149-remediation
    paths:
      - .github/workflows/secdev02-1149-structural-one-shot.yml
permissions:
  contents: write
jobs:
  structural-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-consolidated-1149-remediation
          persist-credentials: true
      - name: Install pinned PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Format test assertions, explanatory comments, query chains and expressions
        run: |
          python3 tools/secdev02_assertion_wrap.py --self-test
          python3 tools/secdev02_comment_wrap.py --self-test
          python3 tools/secdev02_query_chain_wrap.py --self-test
          python3 tools/secdev02_expression_wrap.py --self-test
          python3 tools/secdev02_assertion_wrap.py --apply --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          python3 tools/secdev02_comment_wrap.py --apply --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          python3 tools/secdev02_query_chain_wrap.py --apply --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          python3 tools/secdev02_expression_wrap.py --apply --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          git diff --check
      - name: Validate semantic PHP contracts and full source baseline
        run: |
          python3 tools/build.py
          python3 tools/secdev02_source_contract_repair.py --base-ref HEAD
          git diff --check
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit only verified results and remove privileged workflow
        run: |
          rm .github/workflows/secdev02-1149-structural-one-shot.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-1149-structural-one-shot.yml
          if git diff --cached --quiet; then
            echo 'No new safe corrections'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): consolidated test assertion, query and comment refactor'
          git push origin HEAD:style/secdev02-consolidated-1149-remediation
