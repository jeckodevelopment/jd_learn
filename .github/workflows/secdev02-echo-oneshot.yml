name: SECDEV-02 mixed PHP echo reflow one-shot
on:
  push:
    branches: [style/secdev02-1018-structural-bulk]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Reflow echo boundaries without changing rendered HTML
        shell: bash
        run: |
          set -euo pipefail
          PHPCS="$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcs"
          python3 tools/secdev02_mixed_php_echo_reflow.py --self-test
          python3 tools/secdev02_mixed_php_echo_reflow.py --phpcs "$PHPCS"
      - name: Reconcile full PSR12 and append requirement evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib,subprocess,tempfile,importlib.machinery
          root=pathlib.Path('.').resolve()
          phpcs=root/'.runtime/secdev02-phpcs/vendor/bin/phpcs'
          audit=importlib.machinery.SourceFileLoader('audit',str(root/'tests/secdev02-psr12-phpcs.py')).load_module()
          now=audit.signatures(phpcs,root,audit.tracked_php(root))
          with tempfile.TemporaryDirectory() as td:
              base=pathlib.Path(td)
              before=audit.signatures(phpcs,base,audit.baseline(root,'HEAD',base))
          introduced=audit.diff(now,before)
          files=subprocess.check_output(['git','diff','--name-only','--','*.php'],text=True).splitlines()
          for path in files:
              subprocess.run(['php','-l',path],check=True,stdout=subprocess.DEVNULL)
          start,end=sum(before.values()),sum(now.values())
          assert not introduced,f'PSR12 regression: {introduced}'
          assert end<start and files,f'No measured PHPCS reduction: {start}->{end}'
          print(f'SECDEV-02 PHP echo reflow PHPCS: {start} -> {end} (-{start-end}) on {len(files)} source files',flush=True)
          doc=root/'docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md'
          with doc.open('a',encoding='utf-8') as out:
              out.write(f"\n### Second batch within PR #1016: PHP echo boundaries\n\nThe pinned PHPCS 4.0.4 full tracked-PHP audit measured **{start} → {end}** (-{start-end}) across **{len(files)} PHP files** with zero per-file/per-rule regressions. Newlines are inserted only inside `<?= ... ?>` code regions, leaving rendered markup and PHP significant tokens identical; PHP lint, source contracts and complete CI remain mandatory. **No functional coverage percentage promotion.** SECDEV-02 remains partial while findings remain and CORE/API reviews are pending.\n")
          matrix=root/'docs/REQUIREMENTS_STATUS.csv'
          with matrix.open(newline='',encoding='utf-8') as f:
              rows=list(csv.reader(f))
          header=rows[0]
          sec=[r for r in rows if r and r[0]=='SECDEV-02']
          assert len(sec)==1
          sec[0][header.index('Evidenza e limiti')]+=f' PR #1016 second batch: PHP echo reflow, PSR12 {start}->{end} (-{start-end}) across {len(files)} PHP files, zero new rule findings; coverage percentages unchanged.'
          with matrix.open('w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
          git diff --check
          python3 tests/requirements-status.py
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
      - name: Remove one-shot workflow and commit source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secdev02-echo-oneshot.yml
          git add component libraries plugins tests tools docs
          git diff --cached --check
          git commit -m 'style(SECDEV-02): safe bulk PHP echo reflow and verified evidence'
          git push origin HEAD:style/secdev02-1018-structural-bulk
