name: SECDEV-02 one-shot all-template HTML PSR12 reflow

on:
  push:
    branches:
      - style/secdev02-template-attribute-bulk-v2
    paths:
      - .github/workflows/secdev02-template-attribute-one-shot.yml

permissions:
  contents: write

jobs:
  guarded-template-reflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/secdev02-template-attribute-bulk-v2
          persist-credentials: true
      - name: Install pinned PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Apply guarded HTML attribute reflow across all PHP templates
        run: |
          python3 tools/secdev02_html_attribute_reflow.py --self-test
          python3 tools/secdev02_html_attribute_reflow.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          git diff --check
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
      - name: Commit accepted transformations and remove the one-shot workflow
        run: |
          rm .github/workflows/secdev02-template-attribute-one-shot.yml
          git add -A -- component tools .github/workflows/secdev02-template-attribute-one-shot.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): guarded PHP template HTML line remediation'
          git push origin HEAD:style/secdev02-template-attribute-bulk-v2
