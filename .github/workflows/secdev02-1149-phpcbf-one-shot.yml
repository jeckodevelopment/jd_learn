name: SECDEV-02 one-shot upstream PSR12 structural fixer
on:
  push:
    branches:
      - style/secdev02-consolidated-1149-remediation
    paths:
      - .github/workflows/secdev02-1149-phpcbf-one-shot.yml
permissions:
  contents: write
jobs:
  safe-phpcbf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-consolidated-1149-remediation
          persist-credentials: true
      - name: Install PHPCS and PHP AST parser
        run: |
          mkdir -p .runtime/secdev02-phpcs .runtime/secdev02-ast
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          composer require --working-dir=.runtime/secdev02-ast --no-interaction --no-progress --no-plugins --no-scripts 'nikic/php-parser:^5.4'
      - name: Apply upstream PSR12 code beautifier with AST integrity guard
        run: |
          python3 tools/secdev02_phpcbf_ast_bulk.py --self-test
          python3 tools/secdev02_phpcbf_ast_bulk.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs --phpcbf .runtime/secdev02-phpcs/vendor/bin/phpcbf --parser-dir .runtime/secdev02-ast
          git diff --check
      - name: Verify complete PHP source policy and PSR12 baseline
        run: |
          python3 tools/build.py
          python3 tools/secdev02_source_contract_repair.py --base-ref HEAD
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit verified improvements and remove privileged workflow
        run: |
          rm .github/workflows/secdev02-1149-phpcbf-one-shot.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-1149-phpcbf-one-shot.yml
          if git diff --cached --quiet; then
            echo 'No compliant fixes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): apply upstream PSR12 formatter with AST safeguards'
          git push origin HEAD:style/secdev02-consolidated-1149-remediation
