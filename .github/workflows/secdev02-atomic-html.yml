name: SECDEV-02 atomic HTML long-line remediation
on:
  push:
    branches: [style/secdev02-192-final-consolidated]
    paths: [.github/workflows/secdev02-atomic-html.yml]
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned PSR-12 scanner
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Atomic token-aware HTML wrapping, PHPCS per-rule gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,sys,subprocess
          from collections import defaultdict
          from pathlib import Path
          sys.path.insert(0,'tools')
          from secdev02_structural_template_bulk import spans
          from secdev02_lexer_bulk_wrap import ROOT, lint, phpcs_counts
          from secdev02_calls_reflow_bulk import required_source_fragments
          php_cs=ROOT/'.runtime/secdev02-phpcs/vendor/bin/phpcs'
          required=required_source_fragments()
          tokens=subprocess.check_output(['git','ls-files','-z','--','*.php'],cwd=ROOT).split(b'\0')
          bounds=re.compile(rb'(?<=>)(?=</?(?:div|section|header|footer|aside|main|nav|article|form|ul|ol|li|dl|dt|dd|table|tr|td|th|h[1-6]|p|select|option|input|label|button)(?=[\s>/]))',re.I)
          attrs=re.compile(rb'(?<=\x22) (?=[a-zA-Z][\w:-]*=)')
          total_file=total_fixed=trial_count=0
          for entry in tokens:
              if not entry:continue
              name=entry.decode()
              if '/tmpl/' not in name:continue
              path=ROOT/name
              initial=path.read_bytes()
              if max(map(len,initial.splitlines()),default=0)<=120:continue
              base=phpcs_counts(php_cs,path)
              if not base['Generic.Files.LineLength.TooLong']:continue
              required_fragments=required.get(name,set())
              accepted=attempted=0
              for iteration in range(25):
                  data=path.read_bytes()
                  intervals=spans(path)
                  grouped=defaultdict(list)
                  for lo,hi in intervals:
                      part=data[lo:hi]
                      if re.search(rb'<(?:script|style|pre|textarea)\b',part,re.I):continue
                      for mode,pat in [('blocks',bounds),('attrs',attrs)]:
                          for m in pat.finditer(part):
                              point=lo+m.start()
                              start=data.rfind(b'\n',0,point)+1
                              end=data.find(b'\n',point)
                              if end<0:end=len(data)
                              if end-start<=120 or point-start<25 or end-point<8:continue
                              grouped[(start,end)].append((point,mode))
                  if not grouped:break
                  choices=[]
                  for (start,end),markers in grouped.items():
                      markers=sorted(set(markers))
                      if len(markers)>35:continue
                      for mode in ('blocks','attrs','both'):
                          positions=[p for p,t in markers if mode=='both' or t==mode]
                          if not positions:continue
                          for indent in (0,2,4,8):
                              # Wrap each individual long line, never affect a distinct line.
                              left=data[start:end]
                              pad=b' '*indent
                              changes=[(p,1 if data[p:p+1]==b' ' and any(p==q and t=='attrs' for q,t in markers) else 0) for p in positions]
                              candidate=bytearray(data)
                              for p,w in reversed(changes):
                                  candidate[p:p+w]=b'\n'+pad
                              trial=bytes(candidate)
                              lens=[len(x) for x in trial[start:start+(end-start)+len(changes)*(1+indent)].splitlines()]
                              if max(lens,default=0)>=end-start:continue
                              choices.append((max(lens,default=0),trial))
                  choices.sort(key=lambda x:x[0])
                  best=None
                  for _,trial in choices[:35]:
                      attempted+=1
                      if any(fragment in data and fragment not in trial for fragment in required_fragments):continue
                      path.write_bytes(trial)
                      if not lint(path):
                          path.write_bytes(data);continue
                      after=phpcs_counts(php_cs,path)
                      path.write_bytes(data)
                      if any(after[k]>base[k] for k in after):continue
                      if sum(after.values())>=sum(base.values()):continue
                      best=(trial,after)
                      break
                  if best is None:break
                  path.write_bytes(best[0])
                  base=best[1]
                  accepted+=1
                  print(f'ATOMIC accepted {name} remaining={sum(base.values())}',flush=True)
              if accepted:
                  total_file+=1
                  total_fixed+=accepted
              trial_count+=attempted
          print(f'ATOMIC RESULT files={total_file} accepted_edits={total_fixed} trials={trial_count}',flush=True)
          PY
          git diff --check
          git diff --name-only -- '*.php' | while IFS= read -r f; do php -l "$f" >/dev/null; done
      - name: Measure final inventory and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from collections import Counter
          files=[f for f in subprocess.check_output(['git','ls-files','-z','--','*.php']).decode().split('\0') if f]
          p=subprocess.run(['.runtime/secdev02-phpcs/vendor/bin/phpcs','--standard=PSR12','--report=json',*files],capture_output=True,text=True)
          d=json.loads(p.stdout)
          tally=Counter(m['source'] for x in d['files'].values() for m in x['messages'])
          print('SECDEV-02 ATOMIC TOTAL='+str(sum(tally.values())),flush=True)
          for rule,count in tally.most_common():print('RULE',rule,count,flush=True)
          with open('docs/SECDEV_02_FINAL_192_BATCH.md','a') as output:
              output.write('\n## Third atomic HTML sweep\n\nPHPCS 4.0.4 total after this guarded sweep: **'+str(sum(tally.values()))+'**. CI full validation must certify this preliminary measure; no change to manual acceptance or requirement status.\n')
          PY
          git rm .github/workflows/secdev02-atomic-html.yml
          git add component docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): atomic PHPCS-safe HTML long-line repairs'
          git push origin HEAD:style/secdev02-192-final-consolidated
