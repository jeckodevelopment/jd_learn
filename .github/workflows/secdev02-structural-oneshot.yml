name: SECDEV-02 structural bulk one-shot
on:
  push:
    branches: [style/secdev02-1018-structural-bulk]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned audit dependencies
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Structural templates and larger existing formatter passes
        shell: bash
        run: |
          set -euo pipefail
          PHPCS="$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcs"
          python3 tools/secdev02_structural_template_bulk.py --self-test
          python3 tools/secdev02_structural_template_bulk.py --phpcs "$PHPCS"
          python3 tools/secdev02_template_tag_reflow.py --phpcs "$PHPCS"
          python3 tools/secdev02_html_attribute_reflow.py --phpcs "$PHPCS"
          python3 tools/secdev02_literal_reflow_bulk.py --phpcs "$PHPCS"
          python3 tools/secdev02_whitespace_bulk_refactor.py --phpcs "$PHPCS"
      - name: Verify exact PSR12 reduction and update technical and requirement evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,io,pathlib,subprocess,tempfile,importlib.machinery
          root=pathlib.Path('.').resolve()
          phpcs=root/'.runtime/secdev02-phpcs/vendor/bin/phpcs'
          audit=importlib.machinery.SourceFileLoader('audit',str(root/'tests/secdev02-psr12-phpcs.py')).load_module()
          now=audit.signatures(phpcs,root,audit.tracked_php(root))
          with tempfile.TemporaryDirectory() as td:
              base=pathlib.Path(td)
              old=audit.signatures(phpcs,base,audit.baseline(root,'HEAD',base))
          introduced=audit.diff(now,old)
          # A later guarded formatter can interact with an earlier accepted
          # change. Reject complete regressing files, never hide findings.
          rejected={filename for filename,_rule in introduced}
          for filename in sorted(rejected):
              subprocess.run(['git','restore','--source=HEAD','--',filename],check=True)
              print(f'RESTORED regression source {filename}',flush=True)
          if rejected:
              now=audit.signatures(phpcs,root,audit.tracked_php(root))
              introduced=audit.diff(now,old)
          modified=subprocess.check_output(['git','diff','--name-only','--','*.php'],text=True).splitlines()
          for file in modified: subprocess.run(['php','-l',file],check=True,stdout=subprocess.DEVNULL)
          start,end=sum(old.values()),sum(now.values())
          assert not introduced,f'PSR12 regressions: {introduced}'
          assert end<start and modified,f'No net reduction: {start} -> {end}'
          print(f'SECDEV-02 measured PSR12 {start} -> {end} ({start-end} removed); files={len(modified)}',flush=True)
          doc=root/'docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md'
          with doc.open('a',encoding='utf-8') as f:
              f.write(f"\n## Structural bulk PHP/HTML remediation, PR #1016 (24 November 2026)\n\nPHPCS 4.0.4 PSR12 full repository comparison: **{start} → {end}**, net **{start-end} findings removed** on **{len(modified)} PHP files**, no new file/rule findings. PHP lint successful on every changed file. Structural HTML boundaries only in T_INLINE_HTML plus guarded tag/attribute, literal and whitespace transformations. Any candidate failing source contracts, PHP syntax or per-rule PHPCS was restored. No standards relaxed. **SECDEV-02 remains partial until its CORE services, Joomla API audit and PSR12 residual are fully covered. Functional requirement percentages unchanged; manual acceptance separately pending.**\n\n### Comportamenti da testare\n\n- Verify HTML templates in frontend/backend across desktop/mobile; exact title, link, attribute and field data; confirm no unexpected whitespace-sensitive DOM nodes.\n- Verify PHP syntax, PHPCS PSR12 (zero regressions), contract gates, package build and full Joomla CI.\n")
          table=root/'docs/REQUIREMENTS_STATUS.csv'
          with table.open(newline='',encoding='utf-8') as f:
              reader=csv.reader(f); rows=list(reader)
          header=rows[0]
          ids=[i for i,r in enumerate(rows) if r and r[0]=='SECDEV-02']
          assert len(ids)==1 and len(rows[ids[0]])==len(header)
          row=rows[ids[0]]
          row[header.index('Evidenza e limiti')]+=f' PR #1016: structural guarded template batch, PHPCS PSR12 {start}->{end} (-{start-end}), {len(modified)} source files, no new per-rule violations. Coverage unchanged; SECDEV-02 partial.'
          idx=header.index('PR implementazione')
          assert '1016' not in row[idx].split(';')
          row[idx]+=';1016'
          with table.open('w',newline='',encoding='utf-8') as f:
              writer=csv.writer(f,lineterminator='\n');writer.writerows(rows)
          PY
          python3 tests/requirements-status.py
          git diff --check
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
      - name: Remove disposable workflow and publish one consolidated commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secdev02-structural-oneshot.yml
          git add component libraries plugins tests tools docs
          git diff --cached --check
          git commit -m 'style(SECDEV-02): structural mass remediation of HTML/PHP long lines'
          git push origin HEAD:style/secdev02-1018-structural-bulk
