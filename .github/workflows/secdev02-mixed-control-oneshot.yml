name: SECDEV-02 third mixed PHP source bulk
on:
  push:
    branches: [style/secdev02-1018-structural-bulk]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned verifiers
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          python3 -m pip install --user ruff==0.14.6
      - name: Verify source formatting and reflow mixed PHP control tags
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff check --select E701,E702 tools/secdev02_structural_template_bulk.py tools/secdev02_mixed_php_echo_reflow.py
          python3 tools/secdev02_mixed_php_echo_reflow.py --self-test
          python3 tools/secdev02_mixed_php_echo_reflow.py --phpcs "$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcs"
      - name: Audit full PHPCS and record verified requirement evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib,subprocess,tempfile,importlib.machinery
          root=pathlib.Path('.').resolve()
          phpcs=root/'.runtime/secdev02-phpcs/vendor/bin/phpcs'
          audit=importlib.machinery.SourceFileLoader('audit',str(root/'tests/secdev02-psr12-phpcs.py')).load_module()
          after=audit.signatures(phpcs,root,audit.tracked_php(root))
          with tempfile.TemporaryDirectory() as td:
              base=pathlib.Path(td)
              before=audit.signatures(phpcs,base,audit.baseline(root,'HEAD',base))
          new=audit.diff(after,before)
          modified=subprocess.check_output(['git','diff','--name-only','--','*.php'],text=True).splitlines()
          for name in modified:
              subprocess.run(['php','-l',name],check=True,stdout=subprocess.DEVNULL)
          a,b=sum(before.values()),sum(after.values())
          assert not new,f'PHPCS introduced findings: {new}'
          assert modified and b<a,f'No verified net improvement: {a}->{b}'
          print(f'SECDEV-02 guarded mixed PHP bulk: {a}->{b} net -{a-b} on {len(modified)} PHP files',flush=True)
          doc=root/'docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md'
          with doc.open('a',encoding='utf-8') as stream:
              stream.write(f"\n### Third batch within PR #1016: PHP control tags\n\nPHP-only whitespace layout was applied within both ordinary `<?php ... ?>` and echo blocks of mixed templates. Pinned PHPCS 4.0.4 full scan: **{a} → {b}**, **-{a-b}** net findings on **{len(modified)} PHP files**, no introduced file/rule findings; PHP lint successful. Original significant PHP tokens are preserved. Full CI and manual acceptance remain separate. **No functional coverage promotion, SECDEV-02 still partial** while other findings/CORE/API gaps remain.\n")
          target=root/'docs/REQUIREMENTS_STATUS.csv'
          with target.open(newline='',encoding='utf-8') as f:
              rows=list(csv.reader(f))
          header=rows[0]
          matches=[r for r in rows if r and r[0]=='SECDEV-02']
          assert len(matches)==1
          matches[0][header.index('Evidenza e limiti')]+=f' PR #1016 third batch: mixed PHP control tags {a}->{b}, -{a-b} findings in {len(modified)} PHP files, no regression, coverage unchanged.'
          with target.open('w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
          git diff --check
          python3 tests/requirements-status.py
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secdev02-mixed-control-oneshot.yml
          git add component libraries plugins tests tools docs
          git diff --cached --check
          git commit -m 'style(SECDEV-02): third guarded bulk PHP control-tag remediation'
          git push origin HEAD:style/secdev02-1018-structural-bulk
