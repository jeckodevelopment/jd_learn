name: SECDEV-02 complete residual inventory
on:
  push:
    branches: [style/secdev02-192-final-consolidated]
    paths: [.github/workflows/secdev02-residual-inventory.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Produce exact residual line and rule inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          python3 - <<'PY'
          import json,subprocess
          files=[x for x in subprocess.check_output(['git','ls-files','-z','--','*.php']).decode().split('\0') if x]
          p=subprocess.run(['.runtime/secdev02-phpcs/vendor/bin/phpcs','--standard=PSR12','--report=json',*files],capture_output=True,text=True)
          d=json.loads(p.stdout)
          n=0
          for path,item in d['files'].items():
              for m in item['messages']:
                  print(json.dumps({'file':path,'line':m['line'],'rule':m['source'],'message':m['message']},ensure_ascii=False),flush=True)
                  n+=1
          print('TOTAL_RESIDUAL_FINDINGS',n,flush=True)
          PY
      - name: Remove one-shot inventory workflow
        run: |
          set -e
          git rm .github/workflows/secdev02-residual-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(SECDEV-02): remove one-shot residual inventory'
          git push origin HEAD:style/secdev02-192-final-consolidated
