name: JD Learn verification
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      matrix:
        description: Compatibility coverage (full before milestones/releases)
        type: choice
        options: [standard, full]
        default: standard
permissions:
  contents: read
concurrency:
  group: jd-learn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Candidate plan and lightweight checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.plan.outputs.integration }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate CI policy and choose candidate coverage
        id: plan
        run: |
          python3 tests/ci-plan.py
          python3 tests/requirements-status.py
          python3 tools/ci_plan.py
      - name: Lightweight structure, package and documentation checks
        run: |
          python3 tools/build.py
          python3 tools/check.py
          python3 tests/release-workflow.py
          python3 tests/ftps-publish.py
          python3 tests/ftps-live-probe.py
          python3 tests/ftps-certificate-pin.py
  browser-navigation:
    name: Curriculum navigation in Chromium (controlled fixture)
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix .runtime/browser-tests --no-save playwright@1.64.1
          node .runtime/browser-tests/node_modules/playwright/cli.js install --with-deps chromium
      - name: Unsaved editor desktop and mobile viewport navigation
        env:
          JLMS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.runtime/browser-tests/node_modules/playwright/index.mjs
        run: node tests/curriculum-browser.mjs
  verify:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container: php:${{ matrix.php }}-cli-bookworm
    services:
      db:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_DATABASE: jlms_test
          MYSQL_USER: jlms_ci
          MYSQL_PASSWORD: ci-disposable-password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-disposable-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      JLMS_TEST_DISPOSABLE: '1'
      JLMS_TEST_DSN: mysql:host=db;dbname=jlms_test;charset=utf8mb4
      JLMS_TEST_USER: jlms_ci
      JLMS_TEST_PASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test runtime extensions
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 nodejs ffmpeg unzip libpng-dev libonig-dev libxml2-dev libzip-dev
          docker-php-ext-install -j2 pdo_mysql mysqli gd mbstring dom simplexml zip
      - name: Lint every PHP source
        run: python3 -c "import pathlib,subprocess; [subprocess.run(['php','-l',str(p)],check=True) for p in pathlib.Path('.').rglob('*.php')]"
      - name: Domain, source validation and plugin registry tests
        run: |
          php tests/run.php
          php tests/certificate-pdf.php
          php tests/question-definition.php
          php tests/teaching-rules.php
          php tests/video-duration.php
      - name: Strict calendar dates, explicit zones and DST boundaries
        run: php tests/calendar.php
      - name: Cloudflare configuration, secrets, remote privacy and token tests
        run: php tests/cloudflare.php
      - name: Material format and bounded archive policy tests
        run: php tests/material-policy.php
      - name: Execute schema and integrity tests on the real database
        run: php tests/database.php
      - name: Structural and reproducible package checks
        run: |
          python3 tools/build.py
          python3 tools/check.py
          cp dist/SHA256SUMS.txt /tmp/first-build.sha256
          python3 tools/build.py
          diff /tmp/first-build.sha256 dist/SHA256SUMS.txt
      - name: Check out the previous increment for an actual upgrade test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e11f818b38f1db276814aa9f18eec45b05c00c13
          path: .runtime/previous-source
          persist-credentials: false
      - name: Install minimum Joomla and the complete JD Learn package
        run: |
          mkdir -p .runtime/joomla
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --output /tmp/joomla.zip 'https://downloads.joomla.org/extensions/joomla6/6-0-0/Joomla_6-0-0-Stable-Full_Package.zip?format=zip'
          echo 'cbac50ba7344958ce02ad49e6ef80536aa534a8c  /tmp/joomla.zip' | sha1sum --check --status
          unzip -q /tmp/joomla.zip -d .runtime/joomla
          php .runtime/joomla/installation/joomla.php install --site-name="JD Learn CI" --admin-user="CI Operator" --admin-username=cioperator --admin-password="Ci-only-Long-Password-2026" --admin-email=ci@example.invalid --db-type=mysqli --db-host=db --db-user=jlms_ci --db-pass=ci-disposable-password --db-name=jlms_test --db-prefix=joomla_ --db-encryption=0 --public-folder="" --no-interaction
          python3 .runtime/previous-source/tools/build.py
          php .runtime/joomla/cli/joomla.php extension:install --path="$(pwd)/.runtime/previous-source/dist/pkg_jlms-0.40.1-dev.zip" --no-interaction
          php -r 'ob_start(); $script = $argv[1]; array_shift($argv); require $script;' .runtime/previous-source/tests/joomla-smoke.php .runtime/joomla
          php tests/legacy-time-fixture.php .runtime/joomla
          PACKAGE_VERSION="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("packages/pkg_jlms.xml").findtext("version"))')-dev"
          php tests/install-package.php .runtime/joomla "$(pwd)/dist/pkg_jlms-${PACKAGE_VERSION}.zip"
      - name: Native Joomla MVC, ACL, category, draft and provider smoke tests
        run: php tests/joomla-smoke.php .runtime/joomla retained
      - name: Teaching draft, modules and lessons integration tests
        run: php tests/joomla-curriculum.php .runtime/joomla
      - name: Native question bank, immutable revisions and scoped quiz drafts
        run: php tests/joomla-quiz-authoring.php .runtime/joomla
      - name: Native workflow publication and catalog access tests
        run: php tests/joomla-publication.php .runtime/joomla
      - name: Native course review workflow and live-version preservation
        run: php tests/joomla-publication-review.php .runtime/joomla
      - name: Native pathway authoring, ordering, access and progress aggregation
        run: php tests/joomla-pathways.php .runtime/joomla
      - name: Typed course presentation, frozen public snapshot and legacy clients
        run: php tests/joomla-course-presentation.php .runtime/joomla
      - name: Native teacher profiles, assignments and frozen access-gated history
        run: php tests/joomla-teachers.php .runtime/joomla
      - name: Course calendar persistence, publication, edition and access windows
        run: php tests/joomla-calendar.php .runtime/joomla
      - name: Course editor native scoped ACL, cache, category creation and checkout
        run: php tests/joomla-editor-access.php .runtime/joomla
      - name: Render public and authenticated admin pages over HTTP
        run: python3 tests/http-smoke.py .runtime/joomla
      - name: Native question and quiz forms over HTTP
        run: python3 tests/quiz-authoring-http.py .runtime/joomla
      - name: Text learning, current access and concurrent completion tests
        run: php tests/joomla-learning.php .runtime/joomla
      - name: Real student login, classroom and completion over HTTP
        run: python3 tests/learning-http.py .runtime/joomla
      - name: Quiz snapshots, attempts, CAS, deadlines and native scheduled expiry
        run: php tests/joomla-quiz-attempts.php .runtime/joomla
      - name: Quiz native MVC, protected JSON endpoints and transport retries
        run: |
          python3 tests/quiz-attempts-http.py .runtime/joomla
          node tests/quiz-player.mjs
      - name: Individual quiz time, native audit and immutable existing deadlines
        run: php tests/joomla-quiz-time.php .runtime/joomla
      - name: Native individual-time management form over HTTP
        run: python3 tests/quiz-time-http.py .runtime/joomla
      - name: Previewed invalidation, evidence, effective results, audit and concurrent submission
        run: php tests/joomla-quiz-review.php .runtime/joomla
      - name: Native cancellation preview, confirmation and learner state over HTTP
        run: python3 tests/quiz-review-http.py .runtime/joomla
      - name: Authorized in-progress extensions, audit, boundaries and deadline races
        run: php tests/joomla-quiz-deadline.php .runtime/joomla
      - name: Native extension form, compact state and timing synchronization
        run: |
          python3 tests/quiz-deadline-http.py .runtime/joomla
          node tests/quiz-deadline-player.mjs
      - name: Video telemetry, idempotence and current access integration
        run: php tests/joomla-video.php .runtime/joomla
      - name: Native video classroom, CSRF and progress endpoints over HTTP
        run: python3 tests/video-http.py .runtime/joomla
      - name: Player consent, retry and teardown with a mock browser transport
        run: node tests/video-player.mjs
      - name: Searchable roster filter controls
        run: node tests/roster-filters.mjs
      - name: Audio progress retry and failure recovery
        run: node tests/audio-progress.mjs
      - name: Expiring playback, renewed authorisation and provider failures
        run: php tests/joomla-cloudflare.php .runtime/joomla
      - name: Prepare disposable material course drafts
        run: php tests/materials-fixture.php .runtime/joomla
      - name: Start real ClamAV scanner for materials integration
        if: matrix.php == '8.3'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends clamav-daemon clamav-freshclam
          freshclam --datadir=/var/lib/clamav
          install -d -o clamav -g clamav -m 0750 /run/clamav-jdlearn
          cat > /tmp/jdlearn-clamd.conf <<'EOF'
          LogFile /tmp/jdlearn-clamd.log
          LogTime yes
          PidFile /run/clamav-jdlearn/clamd.pid
          DatabaseDirectory /var/lib/clamav
          LocalSocket /run/clamav-jdlearn/clamd.sock
          LocalSocketMode 660
          User clamav
          Foreground yes
          StreamMaxLength 30M
          MaxThreads 2
          ReadTimeout 30
          CommandReadTimeout 30
          EOF
          clamd --config-file=/tmp/jdlearn-clamd.conf >/tmp/jdlearn-clamd.out 2>&1 &
          for attempt in $(seq 1 60); do
            if [ -S /run/clamav-jdlearn/clamd.sock ]; then break; fi
            sleep 1
          done
          test -S /run/clamav-jdlearn/clamd.sock
          echo 'JLMS_REAL_CLAMD_SOCKET=/run/clamav-jdlearn/clamd.sock' >> "$GITHUB_ENV"
      - name: Protected material uploads, scanner, immutable files and HTTP ranges
        run: python3 tests/materials-http.py .runtime/joomla
      - name: Prepare native MP4 fixture and private local lesson
        run: php tests/html5-fixture.php .runtime/joomla
      - name: Local MP4 upload, protected PHP Range delivery and authorization
        run: python3 tests/html5-http.py .runtime/joomla
      - name: Install pinned native Italian language pack for multilingual tests
        run: |
          curl --fail --location --retry 2 --output /tmp/joomla-it.zip 'https://downloads.joomla.org/cms/joomla6-italian/6-0-0-1/it-it_joomla_lang_full_6-0-0v1-zip?format=zip'
          echo '04e1f9c4c82223de12d291a5f83e7278702697c7  /tmp/joomla-it.zip' | sha1sum --check
          php .runtime/joomla/cli/joomla.php extension:install --path=/tmp/joomla-it.zip --no-interaction
      - name: Native translation graph, language selection, ACL and immutable courses
        run: php tests/joomla-associations.php .runtime/joomla
      - name: Native language switcher, association manager and SEF routing over HTTP
        run: python3 tests/associations-http.py .runtime/joomla
      - name: Native categories, scoped translations, current access and hierarchy lifecycle
        run: php tests/joomla-categories.php .runtime/joomla
      - name: Category public views, pagination, native forms and multilingual SEF navigation
        run: python3 tests/categories-http.py .runtime/joomla
      - name: Owner dashboard history, current access and read-only resume targeting
        run: php tests/joomla-dashboard.php .runtime/joomla
      - name: Private dashboard, native filters and resume authorization over HTTP
        run: python3 tests/dashboard-http.py .runtime/joomla
      - name: Course-scoped administrative enrollment roster and native ACL
        run: php tests/joomla-roster.php .runtime/joomla
      - name: Native roster filters, current administrative scope and read-only HTTP
        run: python3 tests/roster-http.py .runtime/joomla
      - name: Previewed enrollment state changes, audit rollback, quiz preservation and concurrent requests
        run: php tests/joomla-enrollment-state.php .runtime/joomla
      - name: Native suspension and reactivation preview, confirmation, CSRF and current scope
        run: python3 tests/enrollment-state-http.py .runtime/joomla
      - name: Manual admission, fresh learner entitlement, atomic audit and shared edition races
        run: php tests/joomla-manual-enrollment.php .runtime/joomla
      - name: Native manual selection, preview, confirmation, CSRF and learner resume
        run: python3 tests/manual-enrollment-http.py .runtime/joomla
      - name: Explicit preassignment, editorial availability, core entitlement and legacy hash compatibility
        run: php tests/joomla-preassignment.php .runtime/joomla
      - name: Native preassignment warning, opt-in, external grant and same-session revocation
        run: python3 tests/preassignment-http.py .runtime/joomla
      - name: Editable published courses, native history, working copies and teacher custom fields
        run: php tests/joomla-editorial.php .runtime/joomla
      - name: Teacher profile menu layouts, native fields and frontend self editing
        run: python3 tests/editorial-http.py .runtime/joomla
      - name: Independent course, module and lesson duplication with atomic rollback and native ACL
        run: php tests/joomla-duplication.php .runtime/joomla
      - name: Native duplication controls, CSRF, fresh revisions and draft visibility
        run: python3 tests/duplication-http.py .runtime/joomla
      - name: Contextual curriculum builder, exact permutations, moves and frozen history
        run: |
          php tests/joomla-curriculum-builder.php .runtime/joomla
          python3 tests/curriculum-builder-http.py .runtime/joomla
          node tests/curriculum-outline.mjs
          node tests/classroom-outline.mjs
      - name: Native article-style course list filters, ordering, scoped totals and cache
        run: php tests/joomla-courses-ui.php .runtime/joomla
      - name: Course Search Tools, selected actions, compact editor and save-and-open
        run: python3 tests/courses-ui-http.py .runtime/joomla
      - name: Native custom course fields in model and administrator editor
        run: |
          php tests/joomla-course-fields.php .runtime/joomla
          python3 tests/course-fields-http.py .runtime/joomla
          php tests/joomla-course-fields-public.php .runtime/joomla
          python3 tests/course-fields-public-http.py .runtime/joomla
      - name: Programme publication impact, explicit confirmation and stale review rejection
        run: |
          php tests/joomla-publication-impact.php .runtime/joomla
          python3 tests/publication-impact-http.py .runtime/joomla
      - name: Explicit versioned enrollment migration, preview, completion equivalences and idempotency
        run: php tests/joomla-enrollment-migration.php .runtime/joomla
      - name: Automatic authoring metadata, bounded duration differences and native receipts
        run: |
          php tests/joomla-video-duration.php .runtime/joomla
          python3 tests/video-duration-http.py .runtime/joomla
          node tests/video-metadata.mjs
      - name: Versioned teaching rules, exact video thresholds and native forms
        run: |
          php tests/joomla-teaching-rules.php .runtime/joomla
          python3 tests/teaching-rules-http.py .runtime/joomla
      - name: Historical programme recovery, external provider preservation and protected native forms
        run: |
          php tests/joomla-programme-restore.php .runtime/joomla
          python3 tests/programme-restore-http.py .runtime/joomla
      - name: Upgrade the full package with retained data and enabled providers
        run: |
          PACKAGE_VERSION="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("packages/pkg_jlms.xml").findtext("version"))')-dev"
          php tests/install-package.php .runtime/joomla "$(pwd)/dist/pkg_jlms-${PACKAGE_VERSION}.zip" disabled-upgrade
          php tests/joomla-smoke.php .runtime/joomla retained
      - name: Verify completed student history survives package update
        run: php tests/joomla-learning.php .runtime/joomla retained
      - name: Verify material associations survive package update
        run: php tests/materials-fixture.php .runtime/joomla retained
      - name: Verify video coverage survives package update
        run: php tests/joomla-video.php .runtime/joomla retained
      - name: Verify local video history survives package update
        run: php tests/html5-fixture.php .runtime/joomla retained
      - name: Verify question revisions and quiz drafts survive package upgrade
        run: php tests/joomla-quiz-authoring.php .runtime/joomla retained
      - name: Verify attempt snapshots, grades and task state survive upgrade
        run: php tests/joomla-quiz-attempts.php .runtime/joomla retained
      - name: Verify individual allowances, snapshots and native audit after upgrade
        run: php tests/joomla-quiz-time.php .runtime/joomla retained
      - name: Verify invalidations, raw grading and effective results after upgrade
        run: php tests/joomla-quiz-review.php .runtime/joomla retained
      - name: Verify deadline projection, frozen rules and audit after upgrade
        run: php tests/joomla-quiz-deadline.php .runtime/joomla retained
      - name: Verify native translations survive package upgrade
        run: php tests/joomla-associations.php .runtime/joomla retained
      - name: Verify native taxonomy and course relationships survive package upgrade
        run: php tests/joomla-categories.php .runtime/joomla retained
      - name: Verify dashboard history survives retained package upgrade
        run: php tests/joomla-dashboard.php .runtime/joomla retained
      - name: Verify administrative enrollment history survives package upgrade
        run: php tests/joomla-roster.php .runtime/joomla retained
      - name: Verify enrollment state history and native audit survive upgrade
        run: php tests/joomla-enrollment-state.php .runtime/joomla retained
      - name: Verify manual enrollment provenance, receipt and audit survive upgrade
        run: php tests/joomla-manual-enrollment.php .runtime/joomla retained
      - name: Verify preassigned history, blocked access and native audit survive upgrade
        run: php tests/joomla-preassignment.php .runtime/joomla retained
      - name: Verify programme ordering and moves survive package upgrade
        run: php tests/joomla-curriculum-builder.php .runtime/joomla retained
      - name: Verify course administration state survives package upgrade
        run: php tests/joomla-courses-ui.php .runtime/joomla retained
      - name: Verify frozen course presentation after package upgrade
        run: php tests/joomla-course-presentation.php .runtime/joomla retained
      - name: Verify migrated enrollment provenance and source history survive package upgrade
        run: php tests/joomla-enrollment-migration.php .runtime/joomla retained
      - name: Verify teacher profile snapshots and assignments survive upgrade
        run: php tests/joomla-teachers.php .runtime/joomla retained
      - name: Verify frozen calendar and edition dates survive upgrade
        run: php tests/joomla-calendar.php .runtime/joomla retained
      - name: Verify native editor grants, denies and checkout survive upgrade
        run: php tests/joomla-editor-access.php .runtime/joomla retained
      - name: Verify recovered programmes and provider references survive upgrade
        run: php tests/joomla-programme-restore.php .runtime/joomla retained
      - name: Verify configured teaching rules and assigned thresholds survive upgrade
        run: php tests/joomla-teaching-rules.php .runtime/joomla retained
      - name: Verify measured durations, provenance and progress survive upgrade
        run: php tests/joomla-video-duration.php .runtime/joomla retained
      - name: Verify public editorial fields and teaching history survive upgrade
        run: php tests/joomla-course-fields-public.php .runtime/joomla retained
      - name: Verify pathway relations and public access survive package update
        run: php tests/joomla-pathways.php .runtime/joomla retained
      - name: Read package version for artifact label
        id: package
        run: |
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("packages/pkg_jlms.xml").findtext("version"))')-dev"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Make the verified development package downloadable
        if: matrix.php == '8.4' && matrix.database == 'mariadb:10.6'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JD-Learn-${{ steps.package.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
