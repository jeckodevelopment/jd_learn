name: JD Learn verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jd-learn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: ['mysql:8.4', 'mariadb:10.6']
    container: php:${{ matrix.php }}-cli-bookworm
    services:
      db:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_DATABASE: jlms_test
          MYSQL_USER: jlms_ci
          MYSQL_PASSWORD: ci-disposable-password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-disposable-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      JLMS_TEST_DISPOSABLE: '1'
      JLMS_TEST_DSN: mysql:host=db;dbname=jlms_test;charset=utf8mb4
      JLMS_TEST_USER: jlms_ci
      JLMS_TEST_PASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test runtime extensions
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 nodejs ffmpeg nginx unzip libpng-dev libonig-dev libxml2-dev libzip-dev
          docker-php-ext-install -j2 pdo_mysql mysqli gd mbstring dom simplexml zip
      - name: Lint every PHP source
        run: python3 -c "import pathlib,subprocess; [subprocess.run(['php','-l',str(p)],check=True) for p in pathlib.Path('.').rglob('*.php')]"
      - name: Domain, source validation and plugin registry tests
        run: |
          php tests/run.php
          php tests/question-definition.php
      - name: Cloudflare configuration, secrets, remote privacy and token tests
        run: php tests/cloudflare.php
      - name: Material format and bounded archive policy tests
        run: php tests/material-policy.php
      - name: Execute schema and integrity tests on the real database
        run: php tests/database.php
      - name: Structural and reproducible package checks
        run: |
          python3 tools/build.py
          python3 tools/check.py
          cp dist/SHA256SUMS.txt /tmp/first-build.sha256
          python3 tools/build.py
          diff /tmp/first-build.sha256 dist/SHA256SUMS.txt
      - name: Check out the previous increment for an actual upgrade test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 80ed22a1a6295f9682d8ab8a09ba6a9e308f85f1
          path: .runtime/previous-source
          persist-credentials: false
      - name: Install minimum Joomla and the complete JD Learn package
        run: |
          mkdir -p .runtime/joomla
          curl --fail --location --retry 2 --output /tmp/joomla.zip https://github.com/joomla/joomla-cms/releases/download/6.0.0/Joomla_6.0.0-Stable-Full_Package.zip
          unzip -q /tmp/joomla.zip -d .runtime/joomla
          php .runtime/joomla/installation/joomla.php install --site-name="JD Learn CI" --admin-user="CI Operator" --admin-username=cioperator --admin-password="Ci-only-Long-Password-2026" --admin-email=ci@example.invalid --db-type=mysqli --db-host=db --db-user=jlms_ci --db-pass=ci-disposable-password --db-name=jlms_test --db-prefix=joomla_ --db-encryption=0 --public-folder="" --no-interaction
          python3 .runtime/previous-source/tools/build.py
          php .runtime/joomla/cli/joomla.php extension:install --path="$(pwd)/.runtime/previous-source/dist/pkg_jlms-0.14.0-dev.zip" --no-interaction
          php .runtime/previous-source/tests/joomla-smoke.php .runtime/joomla
          php tests/legacy-time-fixture.php .runtime/joomla
          php tests/install-package.php .runtime/joomla "$(pwd)/dist/pkg_jlms-0.15.0-dev.zip"
      - name: Native Joomla MVC, ACL, category, draft and provider smoke tests
        run: php tests/joomla-smoke.php .runtime/joomla retained
      - name: Teaching draft, modules and lessons integration tests
        run: php tests/joomla-curriculum.php .runtime/joomla
      - name: Native question bank, immutable revisions and scoped quiz drafts
        run: php tests/joomla-quiz-authoring.php .runtime/joomla
      - name: Native workflow publication and catalog access tests
        run: php tests/joomla-publication.php .runtime/joomla
      - name: Render public and authenticated admin pages over HTTP
        run: python3 tests/http-smoke.py .runtime/joomla
      - name: Native question and quiz forms over HTTP
        run: python3 tests/quiz-authoring-http.py .runtime/joomla
      - name: Text learning, current access and concurrent completion tests
        run: php tests/joomla-learning.php .runtime/joomla
      - name: Real student login, classroom and completion over HTTP
        run: python3 tests/learning-http.py .runtime/joomla
      - name: Quiz snapshots, attempts, CAS, deadlines and native scheduled expiry
        run: php tests/joomla-quiz-attempts.php .runtime/joomla
      - name: Quiz native MVC, protected JSON endpoints and transport retries
        run: |
          python3 tests/quiz-attempts-http.py .runtime/joomla
          node tests/quiz-player.mjs
      - name: Individual quiz time, native audit and immutable existing deadlines
        run: php tests/joomla-quiz-time.php .runtime/joomla
      - name: Native individual-time management form over HTTP
        run: python3 tests/quiz-time-http.py .runtime/joomla
      - name: Previewed invalidation, evidence, effective results, audit and concurrent submission
        run: php tests/joomla-quiz-review.php .runtime/joomla
      - name: Native cancellation preview, confirmation and learner state over HTTP
        run: python3 tests/quiz-review-http.py .runtime/joomla
      - name: Authorized in-progress extensions, audit, boundaries and deadline races
        run: php tests/joomla-quiz-deadline.php .runtime/joomla
      - name: Native extension form, compact state and timing synchronization
        run: |
          python3 tests/quiz-deadline-http.py .runtime/joomla
          node tests/quiz-deadline-player.mjs
      - name: Video telemetry, idempotence and current access integration
        run: php tests/joomla-video.php .runtime/joomla
      - name: Native video classroom, CSRF and progress endpoints over HTTP
        run: python3 tests/video-http.py .runtime/joomla
      - name: Player consent, retry and teardown with a mock browser transport
        run: node tests/video-player.mjs
      - name: Expiring playback, renewed authorisation and provider failures
        run: php tests/joomla-cloudflare.php .runtime/joomla
      - name: Prepare disposable material course drafts
        run: php tests/materials-fixture.php .runtime/joomla
      - name: Protected material uploads, scanner, immutable files and HTTP ranges
        run: python3 tests/materials-http.py .runtime/joomla
      - name: Prepare native MP4 fixture and private local lesson
        run: php tests/html5-fixture.php .runtime/joomla
      - name: Local MP4 upload, protected Range delivery and real Nginx offload
        run: python3 tests/html5-http.py .runtime/joomla
      - name: Install pinned native Italian language pack for multilingual tests
        run: |
          curl --fail --location --retry 2 --output /tmp/joomla-it.zip 'https://downloads.joomla.org/cms/joomla6-italian/6-0-0-1/it-it_joomla_lang_full_6-0-0v1-zip?format=zip'
          echo '04e1f9c4c82223de12d291a5f83e7278702697c7  /tmp/joomla-it.zip' | sha1sum --check
          php .runtime/joomla/cli/joomla.php extension:install --path=/tmp/joomla-it.zip --no-interaction
      - name: Native translation graph, language selection, ACL and immutable courses
        run: php tests/joomla-associations.php .runtime/joomla
      - name: Native language switcher, association manager and SEF routing over HTTP
        run: python3 tests/associations-http.py .runtime/joomla
      - name: Native categories, scoped translations, current access and hierarchy lifecycle
        run: php tests/joomla-categories.php .runtime/joomla
      - name: Category public views, pagination, native forms and multilingual SEF navigation
        run: python3 tests/categories-http.py .runtime/joomla
      - name: Upgrade the full package with retained data and enabled providers
        run: |
          php tests/install-package.php .runtime/joomla "$(pwd)/dist/pkg_jlms-0.15.0-dev.zip"
          php tests/joomla-smoke.php .runtime/joomla retained
      - name: Verify completed student history survives package update
        run: php tests/joomla-learning.php .runtime/joomla retained
      - name: Verify material associations survive package update
        run: php tests/materials-fixture.php .runtime/joomla retained
      - name: Verify video coverage survives package update
        run: php tests/joomla-video.php .runtime/joomla retained
      - name: Verify local video history survives package update
        run: php tests/html5-fixture.php .runtime/joomla retained
      - name: Verify question revisions and quiz drafts survive package upgrade
        run: php tests/joomla-quiz-authoring.php .runtime/joomla retained
      - name: Verify attempt snapshots, grades and task state survive upgrade
        run: php tests/joomla-quiz-attempts.php .runtime/joomla retained
      - name: Verify individual allowances, snapshots and native audit after upgrade
        run: php tests/joomla-quiz-time.php .runtime/joomla retained
      - name: Verify invalidations, raw grading and effective results after upgrade
        run: php tests/joomla-quiz-review.php .runtime/joomla retained
      - name: Verify deadline projection, frozen rules and audit after upgrade
        run: php tests/joomla-quiz-deadline.php .runtime/joomla retained
      - name: Verify native translations survive package upgrade
        run: php tests/joomla-associations.php .runtime/joomla retained
      - name: Verify native taxonomy and course relationships survive package upgrade
        run: php tests/joomla-categories.php .runtime/joomla retained
      - name: Make the verified development package downloadable
        if: matrix.php == '8.4' && matrix.database == 'mysql:8.4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JD-Learn-0.15.0-dev
          path: dist/
          if-no-files-found: error
          retention-days: 14
