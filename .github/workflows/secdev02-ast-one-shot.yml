name: SECDEV-02 bulk AST-safe PHP-only structural reformat
on:
  push:
    branches:
      - style/secdev02-one-pr-bulk-refactor
    paths:
      - .github/workflows/secdev02-ast-one-shot.yml
permissions:
  contents: write
jobs:
  ast-bulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-one-pr-bulk-refactor
          persist-credentials: true
      - name: Install pinned source inspection and PHP formatter
        run: |
          mkdir -p .runtime/secdev02-phpcs .runtime/secdev02-ast .runtime/secdev02-prettier
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          composer require --working-dir=.runtime/secdev02-ast --no-interaction --no-progress --no-plugins --no-scripts 'nikic/php-parser:^5.4'
          npm install --prefix .runtime/secdev02-prettier --no-save --ignore-scripts --no-audit --no-fund --package-lock=false prettier@3.6.0 @prettier/plugin-php@0.26.0
      - name: Apply AST-equivalent structural formatting to all eligible PHP
        run: |
          python3 tools/secdev02_ast_prettier_bulk.py --self-test
          python3 tools/secdev02_ast_prettier_bulk.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs --parser-dir .runtime/secdev02-ast --prettier .runtime/secdev02-prettier/node_modules/.bin/prettier
          git diff --check
      - name: Gate full PHP syntax, PHPCS and JD Learn structural contracts
        run: |
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit only verified changes and remove privileged workflow
        run: |
          rm .github/workflows/secdev02-ast-one-shot.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-ast-one-shot.yml
          if git diff --cached --quiet; then
            echo 'No AST equivalent formatting passed the gate'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): AST-preserving PHP formatting mass batch'
          git push origin HEAD:style/secdev02-one-pr-bulk-refactor
