name: SECDEV-02 one-shot lexer-guided mass refactoring
on:
  push:
    branches:
      - style/secdev02-token-guided-bulk-refactor
permissions:
  contents: write
concurrency:
  group: secdev02-lexer-bulk-once
  cancel-in-progress: false
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install PHPCS 4.0.4
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Rewrite only safe token-confirmed PHP line boundaries
        run: |
          python3 tools/secdev02_lexer_bulk_wrap.py --self-test
          python3 tools/secdev02_lexer_bulk_wrap.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs --apply
          git diff --check
      - name: Commit reduced debt and remove write workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style(SECDEV-02): batch line wrapping at lexer token boundaries'
          fi
          git rm .github/workflows/secdev02-lexer-bulk-once.yml
          git commit -m 'chore(SECDEV-02): remove one-shot write workflow'
          git push origin HEAD:style/secdev02-token-guided-bulk-refactor
