name: SECDEV-02 structural remediation inventory
on:
  push:
    branches: [style/secdev02-914-structural-closure]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: List exact structural debt with sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,collections,pathlib
          paths=subprocess.check_output(['git','ls-files','-z','--','*.php']).split(b'\0')
          counts=collections.Counter(); rules=collections.defaultdict(list)
          for raw in paths:
              if not raw: continue
              name=raw.decode()
              result=subprocess.run(['.runtime/secdev02-phpcs/vendor/bin/phpcs','--standard=PSR12','--no-cache','--report=json',name],capture_output=True,text=True)
              report=json.loads(result.stdout)
              messages=next(iter(report['files'].values()))['messages']
              for m in messages:
                  counts[m['source']]+=1
                  if m['source']!='Generic.Files.LineLength.TooLong':
                      rules[m['source']].append(f"{name}:{m['line']}")
          print('TOTAL',sum(counts.values()),flush=True)
          print('RULES',dict(counts),flush=True)
          for rule,items in sorted(rules.items()):
              print('STRUCTURAL',rule,'COUNT',len(items),'FILES','; '.join(items),flush=True)
          PY
