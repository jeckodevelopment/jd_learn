name: SECDEV-02 one-shot fluent query refactoring
on:
  push:
    branches:
      - style/secdev02-token-guided-bulk-refactor
permissions:
  contents: write
concurrency:
  group: secdev02-fluent-query-once
  cancel-in-progress: false
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Refactor only validated fluent database queries
        run: |
          python3 tools/secdev02_query_chain_wrap.py --self-test
          python3 tools/secdev02_query_chain_wrap.py --apply --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          git diff --check
      - name: Commit and remove privileged workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style(SECDEV-02): refactor fluent database query lines'
          fi
          git rm .github/workflows/secdev02-query-chain-once.yml
          git commit -m 'chore(SECDEV-02): remove privileged one-shot query formatter'
          git push origin HEAD:style/secdev02-token-guided-bulk-refactor
