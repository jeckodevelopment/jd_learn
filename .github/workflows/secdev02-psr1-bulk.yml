name: SECDEV-02 bulk PSR1 test restructuring
on:
  push:
    branches: [style/secdev02-914-structural-closure]
permissions:
  contents: write
jobs:
  bulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned static analysis and style tooling
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          python3 -m pip install --user ruff==0.14.6
      - name: Extract CLI fixtures into dedicated declaration-only helpers
        run: |
          set -euo pipefail
          python3 -m ruff check --select E701,E702 --fix tools/secdev02_psr1_helper_extraction.py
          python3 tools/secdev02_psr1_helper_extraction.py --self-test
          python3 tools/secdev02_psr1_helper_extraction.py --phpcs "$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcs" --phpcbf "$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcbf"
      - name: Confirm complete PHPCS improvement and original source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.machinery,pathlib,subprocess,tempfile
          root=pathlib.Path('.').resolve()
          phpcs=root/'.runtime/secdev02-phpcs/vendor/bin/phpcs'
          audit=importlib.machinery.SourceFileLoader('audit',str(root/'tests/secdev02-psr12-phpcs.py')).load_module()
          after=audit.signatures(phpcs,root,audit.tracked_php(root))
          with tempfile.TemporaryDirectory() as td:
              base=pathlib.Path(td)
              before=audit.signatures(phpcs,base,audit.baseline(root,'HEAD',base))
          regression=audit.diff(after,before)
          orig=sum(before.values()); remaining=sum(after.values())
          assert not regression, f'File/rule PSR12 regression: {regression}'
          assert orig>remaining, f'No structural debt reduction: {orig}->{remaining}'
          print(f'SECDEV-02 structural PSR1 baseline {orig}->{remaining}, fixed={orig-remaining}',flush=True)
          for name in subprocess.check_output(['git','ls-files','-z','--','*.php']).split(b'\0'):
              if not name: continue
              path=root/name.decode()
              if path.exists() and 'helpers/' in name.decode():
                  subprocess.run(['php','-l',str(path)],check=True,stdout=subprocess.DEVNULL)
          # No manual promotion of coverage percentages; only measured evidence.
          doc=root/'docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md'
          with doc.open('a',encoding='utf-8') as f:
              f.write(f"\n## PSR1 CLI function separation, PR #1017 (24 November 2026)\n\nPinned PHPCS 4.0.4 full tracked-PHP audit: **{orig} → {remaining}**, **{orig-remaining} findings removed**. Test scripts were split into executable entry points and declaration-only helper files; functions are preserved, code paths and fixtures unchanged, no rule/filename regressions. Full PHP lint, source contract CI, Joomla integration and package build are separate mandatory gates. **No functional coverage or Joomla acceptance promoted. SECDEV-02 remains partial while any audit or CORE/API gap persists.**\n\n### Comportamenti da testare\n\n- Same runtime test assertions, fixtures, isolation, error paths and CLI exit codes.\n- All PHP lint, PHPCS PSR12, original source contracts, Joomla integration matrix and Chromium.\n")
          import csv
          matrix=root/'docs/REQUIREMENTS_STATUS.csv'
          with matrix.open(newline='',encoding='utf-8') as f:
              rows=list(csv.reader(f))
          hdr=rows[0]
          matches=[r for r in rows if r and r[0]=='SECDEV-02']
          assert len(matches)==1
          field=hdr.index('Evidenza e limiti')
          matches[0][field]+=f' PR #1017: guarded CLI helper extraction, pinned PHPCS {orig}->{remaining} (-{orig-remaining}); coverage unchanged, criterion partial.'
          prfield=hdr.index('PR implementazione')
          matches[0][prfield]+=';1017'
          with matrix.open('w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
          python3 tools/build.py
          python3 tools/check.py
          python3 tests/requirements-status.py
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          git diff --check
      - name: Publish checked changes, remove disposable workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secdev02-structural-inventory.yml
          git rm .github/workflows/secdev02-psr1-bulk.yml
          git add tests tools docs component libraries plugins
          git diff --cached --check
          git commit -m 'style(SECDEV-02): mass-resolve PSR1 test script side effects with verified helpers'
          git push origin HEAD:style/secdev02-914-structural-closure
