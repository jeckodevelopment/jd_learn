name: SECDEV-02 consolidated high-debt refactor batch
on:
  push:
    branches:
      - style/secdev02-1305-bulk-cleanup
    paths:
      - .github/workflows/secdev02-1305-one-shot.yml
permissions:
  contents: write
jobs:
  bulk-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-1305-bulk-cleanup
          persist-credentials: true
      - name: Install pinned PHP_CodeSniffer
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Mass refactor high-debt PHP sources and tests (pass 1)
        run: |
          python3 tools/secdev02_granular_expression_batch.py --self-test
          python3 tools/secdev02_coordinated_bulk.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs --pass 1
          git diff --check
      - name: Validate contracts and complete PSR-12 gate
        run: |
          python3 tools/build.py
          python3 tools/secdev02_source_contract_repair.py --base-ref HEAD
          git diff --check
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit approved corrections and remove privileged workflow
        run: |
          rm .github/workflows/secdev02-1305-one-shot.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-1305-one-shot.yml
          if git diff --cached --quiet; then
            echo 'No safe mass refactor changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): bulk cleanup of top PHP source and test debt'
          git push origin HEAD:style/secdev02-1305-bulk-cleanup
