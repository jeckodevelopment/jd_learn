name: SECDEV-02 mass PHP and HTML structural reflow
on:
  push:
    branches: [style/secdev02-811-targeted-closure]
permissions:
  contents: write
jobs:
  bulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact PSR12 and Python static verifier versions
        run: |
          set -euo pipefail
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
          python3 -m pip install --user ruff==0.14.6
      - name: Whole-statement PHP operator refactoring with PHPCBF normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff check --select E701,E702 tools/secdev02_mass_operator_semantic.py
          python3 tools/secdev02_mass_operator_semantic.py --self-test
          python3 tools/secdev02_mass_operator_semantic.py --phpcs "$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcs" --phpcbf "$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcbf" --max-files 170 --max-tries 12
      - name: Syntax-aware HTML attribute reflow across Joomla templates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff check --select E701,E702 tools/secdev02_mass_html_attributes.py
          python3 tools/secdev02_mass_html_attributes.py --self-test
          python3 tools/secdev02_mass_html_attributes.py --phpcs "$PWD/.runtime/secdev02-phpcs/vendor/bin/phpcs" --max-files 150
      - name: Enforce original source contracts and reconcile PHPCS against main
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py
          python3 tools/secdev02_source_contract_repair.py --base-ref origin/main --max-reversions 120
          python3 tools/check.py
          python3 - <<'PY'
          import csv,importlib.machinery,pathlib,subprocess,tempfile
          root=pathlib.Path('.').resolve()
          phpcs=root/'.runtime/secdev02-phpcs/vendor/bin/phpcs'
          audit=importlib.machinery.SourceFileLoader('audit',str(root/'tests/secdev02-psr12-phpcs.py')).load_module()
          now=audit.signatures(phpcs,root,audit.tracked_php(root))
          with tempfile.TemporaryDirectory() as td:
              base=pathlib.Path(td)
              old=audit.signatures(phpcs,base,audit.baseline(root,'origin/main',base))
          introduced=audit.diff(now,old)
          before,after=sum(old.values()),sum(now.values())
          changed=subprocess.check_output(['git','diff','origin/main','--name-only','--','*.php'],text=True).splitlines()
          print(f'SECDEV02 MASS SOURCE FULL COMPARISON {before}->{after} net={before-after} changed={len(changed)}',flush=True)
          assert not introduced,f'New finding in file/rule: {introduced}'
          assert before==811, f'Unexpected main baseline {before}'
          assert after<before and changed,'No verified reduction'
          for name in changed:
              subprocess.run(['php','-l',name],check=True,stdout=subprocess.DEVNULL)
          doc=root/'docs/SECDEV_02_CORE_PHP_GATE_1.0.0.md'
          with doc.open('a',encoding='utf-8') as stream:
              stream.write(f"\n### PR #1019 consolidated source-wide audit (24 November 2026)\n\n**Full pinned PHPCS PSR12 4.0.4 against original main baseline: {before} → {after}, net −{before-after} findings over {len(changed)} PHP files**, zero introduced file/rule findings, PHP lint and source contracts passed. Includes AST-equivalent literal concatenations, PHP operator statement layout and attribute-whitespace-only template refactoring. The intermediate report 813 → 770 counted two formatting violations in a new AST verification helper; those helper header errors were corrected, and this consolidated baseline starts at the genuine 811 from main. Source contract repair restored any incompatible files; no security or lint check was disabled. **SECDEV-02 remains partial pending any residuals, separate CORE/API evidence and manual Joomla collaudo.** Functional coverage percentages unchanged.\n\n### Comportamenti da testare\n\n- Complete Joomla courses, class sessions, ACL, curriculum, email, certificates, lesson media and frontend templates.\n- Verify PHP AST equivalence for split literals, HTML attribute values and valid semantic token stream, PHP lint, PHPCS, SAST and Joomla integration suites.\n")
          matrix=root/'docs/REQUIREMENTS_STATUS.csv'
          with matrix.open(newline='',encoding='utf-8') as f:
              rows=list(csv.reader(f))
          hdr=rows[0]
          entry=[r for r in rows if r and r[0]=='SECDEV-02']
          assert len(entry)==1
          entry[0][hdr.index('Evidenza e limiti')]+=f' PR #1019 consolidated PSR12 main baseline {before}->{after} (-{before-after}) over {len(changed)} PHP files, no per-file/per-rule regressions. SECDEV-02 partial; functional coverage unchanged.'
          with matrix.open('w',newline='',encoding='utf-8') as f:
              csv.writer(f,lineterminator='\n').writerows(rows)
          PY
          python3 tests/requirements-status.py
          python3 tests/secdev02-psr12-phpcs.py --base-ref origin/main
          git diff --check
      - name: Remove temporary workflows and record one consolidated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secdev02-811-inventory.yml
          git rm .github/workflows/secdev02-811-audit-helper.yml
          git rm .github/workflows/secdev02-811-operator-html.yml
          git add component libraries plugins tests tools docs
          git diff --cached --check
          git commit -m 'refactor(SECDEV-02): consolidate strict semantic PHP and HTML PSR12 remediation'
          git push origin HEAD:style/secdev02-811-targeted-closure
