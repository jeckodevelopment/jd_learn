name: SECDEV02 diagnose structural candidate regressions
on:
  push:
    branches: [style/secdev02-867-mass-refactor]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          mkdir -p .runtime/psr12
          composer require --working-dir=.runtime/psr12 --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Explain specific function and template rejected candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import sys,pathlib
          sys.path.insert(0,'tools')
          from secdev02_mass_signature_reflow import scan,reflow
          from secdev02_mass_html_reflow import manifest,breakpoints,propose
          from secdev02_lexer_bulk_wrap import ROOT,lex,lint,phpcs_counts
          phpcs=ROOT/'.runtime/psr12/vendor/bin/phpcs'
          functions=[
              'component/administrator/src/Application/CatalogService.php',
              'component/administrator/src/Application/CertificateIssuer.php',
              'component/administrator/src/Application/CertificateService.php',
              'component/administrator/src/Application/CourseCommunicationService.php',
              'component/administrator/src/Application/CurriculumService.php',
              'component/administrator/src/Application/PublicationService.php',
              'component/administrator/src/Application/ConfigurationDiagnostics.php',
              'component/administrator/src/Application/CourseOperationsService.php',
              'component/administrator/src/Infrastructure/ProtectedMaterialStorage.php',
              'component/administrator/src/Model/CourseModel.php',
          ]
          html=[
              'component/site/tmpl/course/default.php',
              'component/site/tmpl/category/default.php',
              'component/site/tmpl/courses/default.php',
              'component/administrator/tmpl/coursepreview/default.php',
              'component/administrator/tmpl/curriculum/default.php',
          ]
          for name in functions+html:
              p=ROOT/name
              old=p.read_bytes()
              baseline=phpcs_counts(phpcs,p)
              oldhash=lex(p)['hash']
              if name in functions:
                  parts=scan(p)
                  trial=reflow(old,parts,4)
                  print('SIGNATURE',name,'pairs',len(parts),'modified',trial!=old,flush=True)
              else:
                  parts=manifest(p)
                  bp=breakpoints(old,parts['inline'],'both')
                  trial=propose(old,bp,2)
                  print('HTML',name,'breakpoints',len(bp),'modified',trial!=old,flush=True)
              if trial!=old:
                  p.write_bytes(trial)
                  after=phpcs_counts(phpcs,p)
                  changed={k:(baseline[k],after[k]) for k in baseline.keys()|after.keys() if baseline[k]!=after[k]}
                  print('METRICS',name,'lint',lint(p),'samePhp',lex(p)['hash']==oldhash,
                        'before',sum(baseline.values()),'after',sum(after.values()),
                        'delta',changed,flush=True)
                  p.write_bytes(old)
          PY
