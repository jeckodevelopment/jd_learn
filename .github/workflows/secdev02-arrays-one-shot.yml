name: SECDEV-02 one-shot syntax-safe array remediation

on:
  push:
    branches:
      - style/secdev02-psr12-consolidated-closeout
    paths:
      - .github/workflows/secdev02-arrays-one-shot.yml

permissions:
  contents: write

jobs:
  array-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: style/secdev02-psr12-consolidated-closeout
          persist-credentials: true
      - name: Pin real PHP_CodeSniffer
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Reflow all eligible one-line PHP arrays
        run: |
          python3 tools/secdev02_array_reflow_bulk.py --self-test
          python3 tools/secdev02_array_reflow_bulk.py --phpcs .runtime/secdev02-phpcs/vendor/bin/phpcs
          git diff --check
      - name: Validate every modified PHP and full PSR12 regression
        run: |
          git diff --name-only -z -- '*.php' | xargs -0 -r -n1 php -l
          python3 tests/secdev02-psr12-phpcs.py --base-ref HEAD
          python3 tools/build.py
          python3 tools/check.py
      - name: Commit permitted batch and eliminate privileged workflow
        run: |
          rm .github/workflows/secdev02-arrays-one-shot.yml
          git add -A -- component libraries plugins packages tests tools .github/workflows/secdev02-arrays-one-shot.yml
          if git diff --cached --quiet; then
            echo "No eligible changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(SECDEV-02): guarded mass PHP array reflow'
          git push origin HEAD:style/secdev02-psr12-consolidated-closeout
