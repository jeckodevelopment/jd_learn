name: SECDEV-02 disposable delimiter source formatting
on:
  push:
    branches: [style/secdev02-linewrap-comma-recovery]
    paths: [.github/workflows/secdev02-delimiter-one-shot.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install official PSR-12 PHPCS
        run: |
          mkdir -p .runtime/secdev02-phpcs
          composer require --working-dir=.runtime/secdev02-phpcs --no-interaction --no-progress --no-plugins --no-scripts 'squizlabs/php_codesniffer:4.0.4'
      - name: Find token-equivalent profitable transformations
        run: python3 tools/secdev02-wrap-disposable.py
      - name: Validate all modifications
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -d '' paths < <(git diff --name-only -z --diff-filter=ACM -- '*.php')
          for path in "${paths[@]}"; do php -l "$path" >/dev/null; done
          echo "Validated ${#paths[@]} changed PHP sources"
      - name: Save accepted changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.php'
          if git diff --cached --quiet; then echo "No accepted source files"; exit 0; fi
          git commit -m "style(SECDEV-02): PHP-token-preserving delimiter long-line repairs"
          git push
