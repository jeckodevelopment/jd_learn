COM_JLMS_SCHEDULER_HEALTH_GUIDANCE="Verifica consigliata"
COM_JLMS_SCHEDULER_GUIDANCE_MISSING="Verifica con un amministratore autorizzato la creazione dell'attività in Joomla → Attività pianificate; non avviare invii sostitutivi manuali."
COM_JLMS_SCHEDULER_GUIDANCE_DISABLED="Verifica con un amministratore autorizzato lo stato del plugin JD Learn e dell'attività; riattiva solo dopo aver controllato la configurazione."
COM_JLMS_SCHEDULER_GUIDANCE_DUPLICATES="Più attività dello stesso tipo: fai verificare e consolidare le duplicazioni prima di un nuovo invio o esecuzione."
COM_JLMS_SCHEDULER_GUIDANCE_FAILED="Controlla il registro di esecuzione Joomla e correggi la causa prima di qualsiasi nuova prova; l'esito non dimostra la consegna di email."
COM_JLMS_SCHEDULER_GUIDANCE_OVERDUE="Verifica la modalità di attivazione dello scheduler Joomla (cron/web) e la prossima esecuzione prevista."
COM_JLMS_SCHEDULER_GUIDANCE_UNKNOWN="Controlla regole, fuso orario e prossima esecuzione in Joomla; stato non sufficiente per confermare il funzionamento."
COM_JLMS_SCHEDULER_GUIDANCE_WAITING="Controlla che la prima esecuzione avvenga all'orario previsto; nessuna consegna è ancora dimostrata."
COM_JLMS_SCHEDULER_GUIDANCE_OPERATIONAL="Controlla periodicamente i registri applicativi; il successo del task non prova la consegna SMTP."

COM_JLMS_PROVIDER_GUIDANCE_NOT_INSTALLED="Chiedi a un amministratore autorizzato di verificare l’installazione del plugin dal pacchetto JD Learn; non scaricare plugin da fonti non verificate."
COM_JLMS_PROVIDER_GUIDANCE_DISABLED="Il plugin è installato ma disattivato. Fai verificare configurazione, consenso e policy prima di abilitarlo in Joomla."
COM_JLMS_PROVIDER_GUIDANCE_UNAVAILABLE="Il plugin risulta abilitato ma non è registrato nel servizio video. Verifica log Joomla e compatibilità dell’estensione, senza disattivare i controlli di sicurezza."
COM_JLMS_PROVIDER_GUIDANCE_NOT_CONFIGURED="Il plugin è registrato ma i prerequisiti locali non sono soddisfatti. Controlla le opzioni del provider e gli eventuali riferimenti a segreti protetti, senza inserire credenziali nelle lezioni."
COM_JLMS_PROVIDER_GUIDANCE_READY="Configurazione locale rilevata. Verifica la riproduzione in un’aula autorizzata: non è una prova di disponibilità del servizio esterno."
COM_JLMS_PROVIDER_GUIDANCE_UNKNOWN="Stato non riconosciuto: chiedi una verifica amministrativa dei log e della configurazione del plugin."

COM_JLMS_SCHEDULER_HEALTH_INVALID_RULES="Regole di esecuzione non valide"
COM_JLMS_SCHEDULER_GUIDANCE_INVALID_RULES="Le regole salvate dell'attività non sono leggibili. Un amministratore autorizzato deve verificare la pianificazione in Joomla senza avviare il task o alterare le code prima del controllo."

COM_JLMS_SAFE_OPERATIONS_TITLE="Procedure sicure per operazioni critiche"
COM_JLMS_SAFE_OPERATIONS_INTRO="Guida in sola lettura: controllare requisiti e autorizzazioni prima di qualunque modifica. Le verifiche non eseguono operazioni, non provano la consegna email o la disponibilità dei video."
COM_JLMS_SAFE_OPERATIONS_STORAGE_TITLE="Storage protetto e video locali"
COM_JLMS_SAFE_OPERATIONS_STORAGE_STEPS="1. Verificare un backup e le autorizzazioni di gestione. 2. Configurare un percorso video assoluto privato, esterno alla directory pubblica, con permessi minimi. 3. Testare upload, streaming Range e accesso negato con un utente diverso. Non rendere pubblici file o disattivare controlli per risolvere errori."
COM_JLMS_SAFE_OPERATIONS_MAIL_TITLE="Coda comunicazioni e invii"
COM_JLMS_SAFE_OPERATIONS_MAIL_STEPS="1. Verificare consenso, destinatari, template e stato del task. 2. Controllare duplicati e messaggi falliti nell'audit. 3. Correggere la causa prima di ritentare da flussi autorizzati; non eseguire invii manuali sostitutivi né reimpostare direttamente lo stato sul database."
COM_JLMS_SAFE_OPERATIONS_CERTIFICATES_TITLE="Attestati e rigenerazione"
COM_JLMS_SAFE_OPERATIONS_CERTIFICATES_STEPS="1. Verificare permesso dedicato, identità e record. 2. Eseguire una diagnosi e preservare la revisione corrente. 3. Rigenerare solo tramite conferma POST autorizzata, con motivazione; non alterare snapshot o PDF nel database o nello storage."
COM_JLMS_SAFE_OPERATIONS_COURSE_TITLE="Pubblicazione, archiviazione e cancellazione"
COM_JLMS_SAFE_OPERATIONS_COURSE_STEPS="1. Verificare iscrizioni attive e dipendenze. 2. Conservare backup, storico e revisioni pubblicate. 3. Preferire archiviazione quando esistono riferimenti; mai cancellare record con SQL o eludere le verifiche del servizio."
COM_JLMS_SAFE_OPERATIONS_SCHEDULER_TITLE="Scheduler Joomla"
COM_JLMS_SAFE_OPERATIONS_SCHEDULER_STEPS="1. Verificare singola istanza per tipo e regole di pianificazione. 2. Controllare ultima esecuzione, errori e scadenze. 3. Correggere soltanto tramite strumenti Joomla con permessi adeguati; non creare task duplicati o invii alternativi."
COM_JLMS_SAFE_OPERATIONS_NOTE="Prima del rilascio collaudare su Joomla con ruoli diversi, includendo errori di configurazione, ripristino e assenza di segreti negli output. Le istruzioni non costituiscono esito di collaudo."
COM_JLMS_CONFIG_DIAGNOSTICS_TITLE="Verifiche di configurazione"
COM_JLMS_CONFIG_DIAGNOSTICS_NOTE="Diagnosi locale in sola lettura: nessuna attività o invio viene avviato. Uno stato corretto non dimostra disponibilità del provider, consegna SMTP o collaudo completo. Eseguire le correzioni soltanto con i permessi Joomla richiesti."
